<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>文博塑料 · 牌号资料库</title>
  <style>


:root {
  --bg: #f3f1ec;
  --bg-accent: #ebe7e0;
  --surface: #fffcf8;
  --surface-2: #f7f4ee;
  --ink: #1c1916;
  --ink-2: #4a453e;
  --ink-3: #7a746b;
  --line: #e6e1d8;
  --line-2: #d4cec4;
  --brand: #1a4548;
  --brand-2: #2a6a6e;
  --brand-soft: #e7f1f1;
  --brand-ink: #123538;
  --copper: #b85e28;
  --copper-soft: #f8eee6;
  --navy: #1e3f63;
  --navy-soft: #e8eef6;
  --ok: #1a6b4a;
  --ok-bg: #e6f4ed;
  --mid: #1d4f86;
  --mid-bg: #e8f0f8;
  --ref: #7a5c1e;
  --ref-bg: #f6f0e0;
  --no: #8f2f2f;
  --no-bg: #f8ecec;
  --shadow: 0 1px 2px rgba(28, 25, 22, 0.04), 0 10px 28px rgba(28, 25, 22, 0.06);
  --shadow-hover: 0 2px 6px rgba(28, 25, 22, 0.06), 0 16px 36px rgba(28, 25, 22, 0.10);
  --radius: 16px;
  --radius-sm: 10px;
  --nav-h: 68px;
  --font: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC",
    "Microsoft YaHei UI", "Microsoft YaHei", "Helvetica Neue", system-ui, sans-serif;
  --mono: "SF Mono", "Menlo", "Consolas", "Sarasa Gothic SC", "Noto Sans Mono CJK SC", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(1100px 520px at 8% -8%, rgba(42, 106, 110, 0.10), transparent 55%),
    radial-gradient(900px 420px at 100% 0%, rgba(184, 94, 40, 0.06), transparent 50%),
    var(--bg);
  min-height: 100vh;
  line-height: 1.6;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select { font-family: inherit; }
button { cursor: pointer; }
a { color: var(--brand-2); text-decoration: none; }
a:hover { color: var(--brand); }

.app { min-height: 100vh; display: flex; flex-direction: column; }

/* ——— Nav ——— */
.nav {
  position: sticky;
  top: 0;
  z-index: 40;
  height: var(--nav-h);
  background: rgba(255, 252, 248, 0.86);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}
.nav-inner {
  max-width: 1180px;
  height: 100%;
  margin: 0 auto;
  padding: 0 28px;
  display: flex;
  align-items: center;
  gap: 28px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--brand-ink);
  font-weight: 600;
  font-size: 15.5px;
  letter-spacing: 0.01em;
  white-space: nowrap;
  flex-shrink: 0;
}
.brand:hover { color: var(--brand-ink); }
.brand-mark {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: linear-gradient(160deg, #2a6a6e, #1a4548);
  color: #f7f4ee;
  display: grid;
  place-items: center;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
}
.search-wrap {
  position: relative;
  flex: 1;
  max-width: 520px;
  margin-left: auto;
}
.search-wrap input {
  width: 100%;
  height: 42px;
  border: 1px solid var(--line-2);
  background: #fff;
  border-radius: 999px;
  padding: 0 16px 0 42px;
  font-size: 14px;
  color: var(--ink);
  outline: none;
  transition: border-color .18s, box-shadow .18s;
}
.search-wrap input::placeholder { color: #9a948b; }
.search-wrap input:focus {
  border-color: #8ab3b5;
  box-shadow: 0 0 0 3px rgba(42, 106, 110, 0.16);
}
.search-icon {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--ink-3);
  pointer-events: none;
}
.search-pop {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow-hover);
  overflow: hidden;
  z-index: 50;
}
.search-item {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  padding: 11px 14px;
  color: var(--ink);
  border-bottom: 1px solid var(--line);
}
.search-item:last-child { border-bottom: 0; }
.search-item:hover, .search-item.active { background: var(--brand-soft); }
.search-item .si-name { font-weight: 600; font-size: 13.5px; letter-spacing: 0.01em; }
.search-item .si-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.search-item .si-tag {
  flex-shrink: 0;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--ink-2);
  margin-top: 2px;
}
.search-empty, .search-hint {
  padding: 14px 16px;
  color: var(--ink-3);
  font-size: 13px;
}

/* ——— Main ——— */
.main {
  flex: 1;
  max-width: 1180px;
  width: 100%;
  margin: 0 auto;
  padding: 28px 28px 48px;
}
.view { animation: rise .32s ease; }
@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .view { animation: none; }
  html { scroll-behavior: auto; }
}

/* ——— Home ——— */
.home-hero { margin-bottom: 8px; }
.eyebrow {
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--brand-2);
  font-weight: 600;
  margin: 0 0 8px;
}
.home-hero h1 {
  font-size: 34px;
  line-height: 1.2;
  font-weight: 650;
  letter-spacing: -0.02em;
  margin: 0 0 8px;
  color: var(--ink);
}
.home-hero p {
  margin: 0;
  color: var(--ink-2);
  font-size: 15.5px;
  max-width: 36em;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 28px 0 22px;
}
.chip {
  border: 1px solid var(--line-2);
  background: var(--surface);
  color: var(--ink-2);
  height: 34px;
  padding: 0 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
}
.chip:hover { border-color: var(--brand-2); color: var(--brand); }
.chip.active {
  background: var(--brand);
  border-color: var(--brand);
  color: #f6fffe;
  box-shadow: 0 1px 2px rgba(26, 69, 72, 0.25);
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
.card {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 18px 14px;
  box-shadow: var(--shadow);
  text-align: left;
  color: inherit;
  min-height: 216px;
  position: relative;
  overflow: hidden;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--cat, var(--brand-2));
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-hover);
  border-color: #c9d6d4;
}
.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.card-id {
  font-size: 22px;
  font-weight: 650;
  letter-spacing: 0.01em;
  line-height: 1.2;
  margin: 0;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.cat-pill {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 999px;
  white-space: nowrap;
  background: var(--cat-bg, var(--brand-soft));
  color: var(--cat-ink, var(--brand));
}
.card-maker { margin: 0 0 8px; font-size: 13px; color: var(--ink-3); }
.card-line { margin: 0 0 12px; font-size: 13.5px; color: var(--ink-2); line-height: 1.55; flex: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.tag {
  font-size: 11.5px;
  color: var(--ink-2);
  background: var(--surface-2);
  border: 1px solid var(--line);
  padding: 2px 8px;
  border-radius: 999px;
}
.specs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: auto;
}
.specs.cols-2 { grid-template-columns: repeat(2, 1fr); }
.spec .sv {
  font-size: 16px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  letter-spacing: -0.01em;
  line-height: 1.2;
}
.spec .su { font-size: 11px; color: var(--ink-3); font-weight: 500; margin-left: 2px; }
.spec .sl { display: block; font-size: 11px; color: var(--ink-3); margin-top: 3px; }

/* ——— Detail ——— */
.back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-2);
  font-size: 13.5px;
  font-weight: 500;
  background: none;
  border: 0;
  padding: 0;
  margin-bottom: 22px;
}
.back:hover { color: var(--brand); }
.jump-note {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--brand-soft);
  border: 1px solid #cfe0e0;
  color: var(--brand-ink);
  border-radius: 12px;
  padding: 11px 14px;
  font-size: 13.5px;
  margin-bottom: 20px;
}
.hero {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 18px;
}
.hero-left { min-width: 0; flex: 1; }
.hero h1 {
  margin: 0 0 6px;
  font-size: 40px;
  line-height: 1.1;
  font-weight: 650;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.hero-meta {
  color: var(--ink-2);
  font-size: 15px;
  margin: 0 0 12px;
}
.hero-meta span + span::before {
  content: "·";
  margin: 0 8px;
  color: var(--ink-3);
}
.hero-actions {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
  flex-shrink: 0;
  min-width: 240px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 42px;
  padding: 0 16px;
  border-radius: 11px;
  font-size: 14px;
  font-weight: 600;
  border: 1px solid transparent;
  transition: transform .12s, background .15s, box-shadow .15s;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: var(--brand);
  color: #f7fffe;
  box-shadow: 0 1px 2px rgba(26, 69, 72, 0.3);
}
.btn-primary:hover { background: #15383b; color: #f7fffe; }
.btn-ghost {
  background: var(--surface);
  border-color: var(--line-2);
  color: var(--ink-2);
}
.btn-ghost:hover { border-color: var(--brand-2); color: var(--brand); }
.select {
  height: 42px;
  border-radius: 11px;
  border: 1px solid var(--line-2);
  background: var(--surface);
  padding: 0 12px;
  font-size: 13px;
  color: var(--ink-2);
  outline: none;
  width: 100%;
}
.select:focus { border-color: #8ab3b5; box-shadow: 0 0 0 3px rgba(42, 106, 110, 0.16); }

.section { margin-bottom: 28px; }
.section h2 {
  font-size: 15px;
  font-weight: 650;
  margin: 0 0 14px;
  color: var(--ink);
  letter-spacing: 0.02em;
}
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 22px;
}

.prop-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.prop-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px 15px;
  box-shadow: 0 1px 2px rgba(28,25,22,0.03);
  min-height: 96px;
  display: flex;
  flex-direction: column;
}
.prop-card .pl {
  font-size: 12px;
  color: var(--ink-3);
  margin-bottom: 8px;
}
.prop-card .pv {
  font-size: 24px;
  font-weight: 650;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
  color: var(--ink);
}
.prop-card .pv .u {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-3);
  letter-spacing: 0;
  margin-left: 4px;
}
.prop-card .pm {
  margin-top: auto;
  padding-top: 8px;
  font-size: 11px;
  color: var(--ink-3);
  line-height: 1.4;
}

.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.list { margin: 0; padding: 0; list-style: none; }
.list li {
  position: relative;
  padding: 0 0 9px 16px;
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.55;
}
.list li:last-child { padding-bottom: 0; }
.list li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.62em;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--brand-2);
  opacity: 0.7;
}

.source-box {
  background: var(--surface-2);
  border: 1px dashed var(--line-2);
  border-radius: 14px;
  padding: 14px 18px;
  font-size: 13px;
  color: var(--ink-2);
}
.source-box strong { color: var(--ink); font-weight: 650; }
.source-box ul { margin: 6px 0 0; padding-left: 18px; }
.source-box li { margin: 3px 0; }

.warn {
  background: var(--ref-bg);
  border: 1px solid #ead9b0;
  color: #5c4514;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 13.5px;
  margin-bottom: 14px;
  line-height: 1.55;
}

/* table */
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  box-shadow: var(--shadow);
}
table.cmp {
  width: 100%;
  border-collapse: collapse;
  min-width: 720px;
  font-size: 13px;
}
table.cmp th, table.cmp td {
  padding: 11px 12px;
  text-align: left;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
table.cmp th {
  background: var(--surface-2);
  font-weight: 650;
  font-size: 12.5px;
  color: var(--ink);
}
table.cmp tr:last-child td { border-bottom: 0; }
table.cmp td.num, table.cmp th.num { font-variant-numeric: tabular-nums; }
table.cmp .ours { background: #f3f8f8; }
table.cmp th.sticky, table.cmp td.sticky {
  position: sticky;
  left: 0;
  background: var(--surface);
  z-index: 1;
  min-width: 108px;
  box-shadow: 4px 0 8px -6px rgba(28,25,22,0.12);
}
table.cmp th.sticky { background: var(--surface-2); }
table.cmp td.ours, table.cmp th.ours { background: #eef5f5; }
table.cmp th.ours.sticky { background: #e8f1f1; }
.th-grade { display: block; font-weight: 650; }
.th-maker { display: block; font-weight: 400; color: var(--ink-3); font-size: 11px; margin-top: 2px; }
.cell-val { font-weight: 550; color: var(--ink); }
.cell-unit { color: var(--ink-3); font-size: 11px; }
.cell-miss { color: #b0aaa2; }
.note-row td { color: var(--ink-2); font-size: 12.5px; line-height: 1.5; background: #fbfaf7; }

.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 650;
  padding: 2px 8px;
  border-radius: 999px;
  margin-top: 6px;
  white-space: nowrap;
}
.badge-closest { background: var(--ok-bg); color: var(--ok); }
.badge-alt { background: var(--mid-bg); color: var(--mid); }
.badge-ref { background: var(--ref-bg); color: var(--ref); }
.badge-no { background: var(--no-bg); color: var(--no); }

/* bars */
.chart-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.seg {
  display: inline-flex;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 3px;
  gap: 2px;
}
.seg button {
  border: 0;
  background: transparent;
  height: 30px;
  padding: 0 12px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 550;
  color: var(--ink-2);
}
.seg button.active {
  background: var(--surface);
  color: var(--brand-ink);
  box-shadow: 0 1px 2px rgba(28,25,22,0.08);
}
.bar-row {
  display: grid;
  grid-template-columns: 148px 1fr 86px;
  gap: 12px;
  align-items: center;
  margin: 9px 0;
}
.bar-name { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-name.ours { color: var(--brand-ink); font-weight: 650; }
.bar-track {
  height: 10px;
  background: #ece8e1;
  border-radius: 999px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 999px;
  background: #c5cdc9;
  width: 0;
  transition: width .45s ease;
}
.bar-fill.ours { background: linear-gradient(90deg, #2a6a6e, #1a4548); }
.bar-val { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink-2); text-align: right; }
.bar-empty { font-size: 13px; color: var(--ink-3); padding: 8px 0; }

/* quote */
.quote details {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 4px 18px 4px;
}
.quote summary {
  cursor: pointer;
  font-weight: 650;
  font-size: 14px;
  padding: 12px 0;
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--ink);
}
.quote summary::-webkit-details-marker { display: none; }
.quote summary::after {
  content: "展开";
  font-weight: 500;
  font-size: 12px;
  color: var(--ink-3);
}
.quote details[open] summary::after { content: "收起"; }
.quote-body { padding: 0 0 16px; }
.quote-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
}
.field label {
  display: block;
  font-size: 12px;
  color: var(--ink-3);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  height: 40px;
  border: 1px solid var(--line-2);
  border-radius: 10px;
  padding: 0 12px;
  font-size: 14px;
  background: #fff;
  outline: none;
  font-variant-numeric: tabular-nums;
}
.field input:focus { border-color: #8ab3b5; box-shadow: 0 0 0 3px rgba(42, 106, 110, 0.16); }
.total-box {
  height: 40px;
  display: flex;
  align-items: center;
  font-size: 18px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  color: var(--brand-ink);
}
.quote-hint { margin: 8px 0 0; font-size: 12px; color: var(--ink-3); }

/* footer + toast */
.site-footer {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 28px 40px;
  color: var(--ink-3);
  font-size: 12.5px;
  line-height: 1.6;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%) translateY(8px);
  background: var(--brand-ink);
  color: #f6fffe;
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 550;
  box-shadow: var(--shadow-hover);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 80;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.muted { color: var(--ink-3); }

@media (max-width: 980px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
  .prop-grid { grid-template-columns: repeat(2, 1fr); }
  .split, .quote-grid { grid-template-columns: 1fr; }
  .hero { flex-direction: column; }

  function runSearch(q) {
    const nq = norm(q);
    if (!nq) return GRADES.slice();
    const tokens = nq.split(/[\s,，、;]+/).filter(Boolean);
    const hits = [];
    INDEX.forEach(function (it) {
      let score = 0;
      const gn = norm(it.g.grade);
      const idn = norm(it.g.id);
      tokens.forEach(function (t) {
        if (gn === t || idn === t) score += 50;
        else if (gn.indexOf(t) === 0 || idn.indexOf(t) === 0) score += 20;
        else if (it.hay.indexOf(t) >= 0) score += 5;
        else score -= 100;
      });
      if (score > 0) hits.push({ g: it.g, score: score });
    });
    hits.sort(function (a, b) { return b.score - a.score || a.g.grade.localeCompare(b.g.grade, "zh"); });

  }

    const makerOpts = ['<option value="">全部厂家</option>'].concat(makers.map(function (m) {
      const n = GRADES.filter(function (g) { return g.maker === m; }).length;
      return '<option value="' + esc(m) + '"' + (state.maker === m ? " selected" : "") + ">" + esc(m) + "（" + n + "）</option>";
    })).join("");
    const typeOpts = ['<option value="">全部材料类型</option>'].concat(types.map(function (tp) {
      const n = GRADES.filter(function (g) { return g.type === tp; }).length;
      return '<option value="' + esc(tp) + '"' + (state.type === tp ? " selected" : "") + ">" + esc(tp) + "（" + n + "）</option>";
    })).join("");

    const rows = pageItems.map(function (g) {
      const mfr = displayValue(propOf(g, "mfr"), "mfr");
      const den = displayValue(propOf(g, "density"), "density");
      return '<a class="grow" href="#/grade/' + encodeURIComponent(g.id) + '">' +
        '<div class="gn">' + esc(g.grade) + "</div>" +
        '<div class="badge-wrap">' + qualityBadge(g) + (g.core ? ' <span class="badge badge-core">常用</span>' : "") + "</div>" +
        '<div class="gm">' + esc(g.maker) + "</div>" +
        '<div class="gt">' + esc(g.type || "—") + "</div>" +
        '<div class="gs gs-mfr">' + (mfr.text === "—" ? "—" : "<b>" + esc(mfr.text) + "</b>") + "</div>" +
        '<div class="gs gs-den">' + (den.text === "—" ? "—" : "<b>" + esc(den.text) + "</b>") + "</div>" +
        '<div class="gk">' + esc((g.keywords || []).slice(0, 4).join(" · ") || g.line || "") + "</div></a>";
    }).join("");

    let pager = "";
    if (pages > 1) {
      const btns = [];
      btns.push('<button type="button" data-page="' + Math.max(1, state.page - 1) + '" ' + (state.page === 1 ? "disabled" : "") + ">上一页</button>");
      var win = 2;
      for (var i = 1; i <= pages; i++) {
        if (i === 1 || i === pages || (i >= state.page - win && i <= state.page + win)) {
          btns.push('<button type="button" data-page="' + i + '" aria-current="' + (i === state.page) + '">' + i + "</button>");
        } else if (i === state.page - win - 1 || i === state.page + win + 1) {
          btns.push("<span>…</span>");
        }
      }
      btns.push('<button type="button" data-page="' + Math.min(pages, state.page + 1) + '" ' + (state.page === pages ? "disabled" : "") + ">下一页</button>");
      pager = '<div class="pager">' + btns.join("") + "</div>";
    }

    document.getElementById("main").innerHTML =
      '<div class="home-lead"><div><h1>牌号资料库</h1><p>共 ' + GRADES.length + " 个牌号。选中即可查看物性、对标并导出客户 PDF。</p></div></div>" +
      '<section class="featured"><h2>常用牌号</h2><div class="featured-grid">' + featured + "</div></section>" +
      '<div class="toolbar"><div class="toolbar-title">筛选全部牌号</div>' +
      '<div class="toolbar-row" id="q-filters">' + qChips + "</div>" +
      '<div class="toolbar-row" style="margin-top:8px">' +
      '<select class="filter-sel" id="flt-maker" aria-label="按厂家筛选">' + makerOpts + "</select>" +
      '<select class="filter-sel" id="flt-type" aria-label="按材料类型筛选">' + typeOpts + "</select>" +
      "</div></div>" +
      '<div class="result-meta"><span>筛选结果 ' + total + " 个" +
      (total ? "，第 " + state.page + " / " + pages + " 页" : "") + "</span></div>" +
      (total ? '<div class="ghead"><span>牌号</span><span>来源</span><span>厂家</span><span>类型</span><span>熔指</span><span>密度 g/cm³</span><span>用途关键词</span></div>' +
        '<div class="glist">' + rows + "</div>" + pager
        : '<div class="empty">没有符合条件的牌号，请试着改一下筛选或搜索词。</div>');

    document.getElementById("q-filters").addEventListener("click", function (e) {
      const btn = e.target.closest("[data-quality]");
      if (!btn) return;
      state.quality = btn.getAttribute("data-quality");
      state.page = 1;
      goHome(homeParamsFromState());
    });
    document.getElementById("flt-maker").addEventListener("change", function (e) {
      state.maker = e.target.value; state.page = 1; goHome(homeParamsFromState());
    });
    document.getElementById("flt-type").addEventListener("change", function (e) {
      state.type = e.target.value; state.page = 1; goHome(homeParamsFromState());
    });
    document.querySelectorAll(".pager [data-page]").forEach(function (b) {
      b.addEventListener("click", function () {
        state.page = parseInt(b.getAttribute("data-page"), 10) || 1;
        goHome(homeParamsFromState());
        window.scrollTo(0, 0);
      });
    });
  }

  function sourceLabel(p, g) {
    const s = (p && p.source) || g.extract_from;
    if (s === "tds") return "厂家物性表";
    if (s === "series") return "系列总表";
    if (s === "chart") return "对比图";
    if (s === "xlsx") return "牌号清单参考值";
    return "";
  }

  function industryBodyHtml(ind) {
    let html = '<p class="pitch">' + esc(ind.pitch || "") + "</p>";
    html += '<div class="tags">';
    (ind.keyBenefits || []).forEach(function (b) { html += '<span class="tag">' + esc(b) + "</span>"; });
    html += "</div>";
    if (ind.applications && ind.applications.length) {
      html += "<h3>应用方式</h3><ul>";
      ind.applications.forEach(function (a) { html += "<li>" + esc(a) + "</li>"; });
      html += "</ul>";
    }
    if (ind.whyItWorks && ind.whyItWorks.length) {
      html += "<h3>为什么能这样用</h3>";
      ind.whyItWorks.forEach(function (w) {
        html += '<div class="why-item"><strong>' + esc(w.benefit) + "</strong><p>" + esc(w.detail) + "</p></div>";
      });
    }
    if (ind.competitorsNote) html += '<p class="peers-note">' + esc(ind.competitorsNote) + "</p>";
    if (ind.caveat) html += '<p class="src-note">' + esc(ind.caveat) + "</p>";
    return html;
  }
  function industrySectionHtml(g) {
    const list = industriesOf(g);
    if (!list.length) return "";
    const current = list.some(function (x) { return x.id === state.industryId; }) ? state.industryId : list[0].id;
    state.industryId = current;
    const tabs = list.map(function (ind) {
      return '<button type="button" class="qchip" data-ind="' + esc(ind.id) + '" aria-pressed="' + (ind.id === current) + '">' + esc(ind.name) + "</button>";
    }).join("");
    const ind = industryById(g, current);
    return '<section class="section" id="industry-sec"><h2>行业用途</h2><div class="toolbar-row" style="margin-bottom:12px">' + tabs + "</div>" + industryBodyHtml(ind) + "</section>";
  }

  function compareTableHtml(g, cols, keys, auto) {
    let html = '<div class="table-wrap"><table class="cmp"><thead><tr><th>项目</th>';
    cols.forEach(function (c) { html += "<th>" + esc(c.head) + "</th>"; });
    html += "</tr></thead><tbody>";
    keys.forEach(function (k) {
      html += "<tr><th>" + esc(PROP_LABEL[k] || k) + "</th>";
      cols.forEach(function (c) {
        const dv = displayValue(c.props[k], k);
        const ml = methodLine(c.props[k]);
        html += "<td>" + esc(dv.text) + (dv.unit && dv.text !== "—" ? ' <span class="u">' + esc(dv.unit) + "</span>" : "");
        if (ml) html += '<div class="pm">' + esc(ml) + "</div>";
        html += "</td>";
      });
      html += "</tr>";
    });
    html += "</tbody></table></div>";
    return html;
  }

  function renderDetail(g) {
    const m = metaOf(g.id);
    const q = loadQuotes()[g.id] || emptyQuote();
    const keys = propKeysFor(g);
    const props = g.properties || {};
    const notes = [];
    keys.forEach(function (k) {
      const p = props[k];
      if (p && p.note) notes.push((PROP_LABEL[p.label ? "" : k] || p.label || PROP_LABEL[k] || k) + "：" + p.note);
    });
    if (g.prop_note) notes.push(g.prop_note);
    if (g.qualityNote && g.quality !== "tds") notes.push(g.qualityNote);

    let grid = '<div class="prop-grid">';
    keys.forEach(function (k) {
      const p = props[k] || {};
      const dv = displayValue(p, k);
      const lab = p.label || PROP_LABEL[k] || k;
      const ml = methodLine(p);
      const src = sourceLabel(p, g);
      grid += '<div class="prop-card"><div class="pl">' + esc(lab) + "</div>" +
        '<div class="pv">' + esc(dv.text) + (dv.unit && dv.text !== "—" ? ' <span class="u">' + esc(dv.unit) + "</span>" : "") + "</div>" +
        (ml ? '<div class="pm">' + esc(ml) + "</div>" : "") +
        (src ? '<div class="pm">' + esc(src) + "</div>" : "") +
        "</div>";
    });
    if (!keys.length) {
      grid += '<div class="prop-card"><div class="pl">物性</div><div class="pv">暂无数值</div></div>';
    }
    grid += "</div>";
    if (notes.length) {
      grid += '<div class="src-note no-print-web">' + notes.map(function (n) { return "<div>" + esc(n) + "</div>"; }).join("") + "</div>";
    }

    let feat = "";
    if (g.description) feat += "<p>" + esc(g.description) + "</p>";
    if ((g.features || []).length) {
      feat += "<h3>厂家标注特点</h3><ul>" + g.features.map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("") + "</ul>";
    }
    if ((g.applications || []).length) {
      feat += "<h3>主要用途</h3><ul>" + g.applications.map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("") + "</ul>";
    }

    let cmp = "";
    if (g.core && (g.competitors || []).length) {
      const cols = [{ head: "我方 · " + g.grade, props: props, kind: "ours" }].concat(g.competitors.map(function (c) {
        return { head: (c.maker ? c.maker + " " : "") + (c.name || c.grade || ""), props: c.properties || {}, kind: "comp", match: c.match };
      }));
      const ckeys = (function () {
        const seen = keys.slice();
        g.competitors.forEach(function (c) {
          Object.keys(c.properties || {}).forEach(function (k) { if (seen.indexOf(k) < 0) seen.push(k); });
        });
        return seen;
      })();
      cmp = "<h2>竞品对照</h2>" + compareTableHtml(g, cols, ckeys, false);
      cmp += '<div class="cmp-notes">';
      g.competitors.forEach(function (c) {
        const tag = c.match || c.match_tag || "";
        const cls = BADGE_CLASS[tag] || "badge-ref";
        cmp += '<div class="cmp-note"><span class="badge ' + cls + '">' + esc(tag || "参照") + "</span> <strong>" +
          esc(c.name || c.grade) + "</strong><p>" + esc(c.note || c.match_note || "") + "</p></div>";
      });
      if (m.familyNote) cmp += '<p class="peers-note">' + esc(m.familyNote) + "</p>";
      cmp += "</div>";
    } else {
      cmp = "<h2>同类可对标牌号</h2>";
      cmp += '<p class="peers-note">' + esc(g.peers_note || "按相同材料类型、最接近的熔指与密度在本资料库内自动匹配，仅供参考，并非已验证的等价替代或可直接替换牌号。") + "</p>";
      if (g.peers && g.peers.length) {
        cmp += '<div class="table-wrap"><table class="cmp"><thead><tr><th>牌号</th><th>厂家</th><th>类型</th><th>熔指</th><th>密度</th></tr></thead><tbody>';
        // include self as first row
        const selfM = displayValue(propOf(g, "mfr"), "mfr");
        const selfD = displayValue(propOf(g, "density"), "density");
        cmp += "<tr><th>" + esc(g.grade) + "（本牌号）</th><td>" + esc(g.maker) + "</td><td>" + esc(g.type || "") + "</td><td>" +
          esc(selfM.text) + (selfM.unit && selfM.text !== "—" ? " " + esc(selfM.unit) : "") + "</td><td>" +
          esc(selfD.text) + "</td></tr>";
        g.peers.forEach(function (p) {
          const dens = (p.density_gcm3 != null) ? Number(p.density_gcm3).toFixed(3) : (p.density != null ? prettyText(p.density) : "—");
          cmp += '<tr><th><a href="#/grade/' + encodeURIComponent(p.id) + '">' + esc(p.grade) + "</a></th><td>" +
            esc(p.maker) + "</td><td>" + esc(p.type || "") + "</td><td>" + esc(prettyText(p.mfr)) + "</td><td>" + esc(dens) + "</td></tr>";
        });
        cmp += "</tbody></table></div>";
      } else {
        cmp += '<p class="src-note">暂无足够的熔指、密度数据，无法自动匹配。</p>';
      }
    }

    const noneNote = g.quality === "none"
      ? '<div class="warn-internal">该牌号暂无厂家物性表。' + esc(g.qualityNote || "仅有合格证或 SDS，原件未复制。") + (isPresent(propOf(g, "mfr")) || isPresent(propOf(g, "density")) ? " 下列熔指/密度如有数值，来自牌号清单参考值，不是厂家正式物性。" : "") + "</div>"
      : "";
    const chartNote = g.quality === "chart"
      ? '<div class="peers-note">该牌号目前只有「多厂商-POE-对比图」上的熔指与密度，没有官方单页物性表。数值仅供参考。</div>'
      : "";
    const internal = g.internal
      ? '<div class="warn-internal">该资料标注为内部合同版，仅限公司内部使用。导出给客户前请确认是否适合发出。</div>'
      : "";

    const srcWeb = (g.sources && g.sources.length)
      ? "<h2>资料来源</h2><ul class='web-only'>" + g.sources.map(function (s) {
          const t = typeof s === "string" ? s : (s.name || s.title || "") + (s.file ? " — " + s.file : "");
          return "<li>" + esc(t) + "</li>";
        }).join("") + "</ul>"
      : (g.source_file ? '<p class="src-note web-only">资料文件：' + esc(g.source_file) + "</p>" : "");

    const exportDock = renderExportDock(g, q);

    document.getElementById("main").innerHTML =
      '<p class="crumb"><a href="#/">全部牌号</a> / ' + esc(g.grade) + "</p>" +
      '<section class="hero"><div class="hero-left">' +
      '<div class="hero-meta">' + qualityBadge(g) +
      (g.core ? ' <span class="badge badge-core">常用</span>' : "") +
      (g.internal ? ' <span class="badge badge-internal">内部合同版</span>' : "") + "</div>" +
      "<h1>" + esc(g.grade) + "</h1>" +
      '<p class="hero-maker">' + esc(m.makerShort || g.maker) + (g.type ? " · " + esc(g.type) : "") + "</p>" +
      (g.makerLegal && g.makerLegal !== g.maker ? '<p class="hero-type">' + esc(g.makerLegal) + "</p>" : "") +
      "<p>" + esc(m.line || g.line || "") + "</p>" +
      '<div class="tags">' + (m.tags || g.keywords || []).slice(0, 8).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") + "</div>" +
      "</div></section>" +
      internal + noneNote + chartNote +
      '<section class="section"><h2>典型物性</h2>' + grid + "</section>" +
      (feat ? '<section class="section">' + feat + "</section>" : "") +
      industrySectionHtml(g) +
      '<section class="section" id="compare-sec">' + cmp + "</section>" +
      '<section class="block web-only">' + srcWeb + "</section>" +
      exportDock;

    bindDetailEvents(g);
  }

  function renderExportDock(g, q) {
    const inds = industriesOf(g);
    const hasInd = inds.length > 0;
    let indSel = "";
    if (hasInd) {
      indSel = '<label for="ex-industry-sel">行业用途范围</label><select id="ex-industry-sel">' +
        '<option value="all">全部</option>' +
        inds.map(function (ind) { return '<option value="' + esc(ind.id) + '">' + esc(ind.name) + "</option>"; }).join("") +
        "</select>";
    }
    const total = (parseFloat(q.price) || 0) * (parseFloat(q.qty) || 0);
    return '<section class="export-dock" id="export-dock">' +
      '<div class="export-col"><h2>导出内容</h2>' +
      '<label><input type="checkbox" id="ex-profile" checked> 资料（物性、特点、用途）</label>' +
      '<label><input type="checkbox" id="ex-compare" checked> 对比（竞品或自动对标）</label>' +
      '<label><input type="checkbox" id="ex-quote" checked> 报价</label>' +
      (hasInd ? '<label><input type="checkbox" id="ex-industry" checked> 行业用途</label>' + indSel : "") +
      "</div>" +
      '<div class="export-col quote"><h2>报价</h2>' +
      '<div class="quote-grid">' +
      '<label>客户<input id="q-customer" value="' + esc(q.customer) + '" placeholder="客户名称（可选）"></label>' +
      '<label>单价（元/吨）<input id="q-price" inputmode="decimal" value="' + esc(q.price) + '" placeholder="例如 12800"></label>' +
      '<label>数量（吨）<input id="q-qty" inputmode="decimal" value="' + esc(q.qty) + '" placeholder="例如 5"></label>' +
      '<label>交期<input id="q-delivery" value="' + esc(q.delivery) + '" placeholder="例如 现货 / 两周"></label>' +
      '<label>报价有效期<input id="q-validity" value="' + esc(q.validity) + '" placeholder="例如 7 天"></label>' +
      '<label class="span2">备注<input id="q-remarks" value="' + esc(q.remarks) + '" placeholder="可填写付款或包装要求"></label>' +
      "</div>" +
      '<p class="quote-hint">合计 <strong id="q-total">' + (total ? formatYuan(total) : "—") + "</strong></p>" +
      "</div>" +
      '<div class="export-col export-actions">' +
      '<button type="button" class="btn btn-primary" id="btn-pdf">导出 PDF</button>' +
      '<p class="export-hint">在打印窗口选择「另存为 PDF」。请关闭页眉页脚，避免出现本地路径。</p>' +
      (g.internal ? '<p class="export-hint">该牌号为内部合同版，请确认后再发给客户。</p>' : "") +
      "</div></section>";
  }

  function bindDetailEvents(g) {
    function readQuote() {
      return {
        customer: (document.getElementById("q-customer") || {}).value || "",
        price: (document.getElementById("q-price") || {}).value || "",
        qty: (document.getElementById("q-qty") || {}).value || "",
        delivery: (document.getElementById("q-delivery") || {}).value || "",
        validity: (document.getElementById("q-validity") || {}).value || "",
        remarks: (document.getElementById("q-remarks") || {}).value || ""
      };
    }
    function persist() {
      const all = loadQuotes();
      all[g.id] = readQuote();
      saveQuotes(all);
      const q = all[g.id];
      const total = (parseFloat(q.price) || 0) * (parseFloat(q.qty) || 0);
      const el = document.getElementById("q-total");
      if (el) el.textContent = total ? formatYuan(total) : "—";
    }
    ["q-customer","q-price","q-qty","q-delivery","q-validity","q-remarks"].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.addEventListener("input", persist);
    });
    const indTabs = document.getElementById("industry-sec");
    if (indTabs) {
      indTabs.addEventListener("click", function (e) {
        const b = e.target.closest("[data-ind]");
        if (!b) return;
        state.industryId = b.getAttribute("data-ind");
        persist();
        renderDetail(g);
      });
    }
    const pdf = document.getElementById("btn-pdf");
    if (pdf) pdf.addEventListener("click", function () {
      persist();
      preparePrint(g);
      const title = suggestPdfTitle(g, readQuote());
      const prev = document.title;
      document.title = title;
      window.print();
      setTimeout(function () { document.title = prev; }, 500);
    });
  }

  function printIndustryHtml(ind) {
    if (!ind) return "";
    let html = '<h2>行业用途 · ' + esc(ind.name) + "</h2>";
    if (ind.pitch) html += "<p>" + esc(ind.pitch) + "</p>";
    if (ind.keyBenefits && ind.keyBenefits.length) html += "<p>卖点：" + esc(ind.keyBenefits.join("、")) + "</p>";
    if (ind.applications && ind.applications.length) {
      html += "<ul>";
      ind.applications.forEach(function (a) { html += "<li>" + esc(customerText(a)) + "</li>"; });
      html += "</ul>";
    }
    if (ind.whyItWorks) {
      ind.whyItWorks.forEach(function (w) {
        html += "<p><strong>" + esc(w.benefit) + "</strong>　" + esc(customerText(w.detail)) + "</p>";
      });
    }
    if (ind.competitorsNote) html += "<p>" + esc(customerText(ind.competitorsNote)) + "</p>";
    if (ind.caveat) html += "<p>" + esc(customerText(ind.caveat)) + "</p>";
    return html;
  }

  function preparePrint(g) {
    const q = (loadQuotes()[g.id] || emptyQuote());
    const wantProfile = !document.getElementById("ex-profile") || document.getElementById("ex-profile").checked;
    const wantCompare = !document.getElementById("ex-compare") || document.getElementById("ex-compare").checked;
    const wantQuote = !document.getElementById("ex-quote") || document.getElementById("ex-quote").checked;
    const wantIndustry = document.getElementById("ex-industry") ? document.getElementById("ex-industry").checked : false;
    const indSel = document.getElementById("ex-industry-sel");
    const m = metaOf(g.id);
    const keys = propKeysFor(g);
    const props = g.properties || {};
    let html = '<div class="print-head"><h1>' + esc(g.grade) + "</h1><p>文博塑料 · 牌号资料与报价</p>";
    if (q.customer) html += "<p>客户：" + esc(q.customer) + "</p>";
    html += "<p>" + esc(m.makerShort || g.maker) + (g.type ? " · " + esc(g.type) : "") + "</p></div>";

    if (wantProfile) {
      html += "<h2>典型物性</h2><table>";
      keys.forEach(function (k) {
        const p = props[k] || {};
        const dv = displayValue(p, k);
        const lab = p.label || PROP_LABEL[k] || k;
        const ml = methodLine(p);
        html += "<tr><th>" + esc(lab) + "</th><td>" + esc(dv.text) + (dv.unit && dv.text !== "—" ? " " + esc(dv.unit) : "") +
          (ml ? "（" + esc(ml) + "）" : "") + "</td></tr>";
      });
      html += "</table>";
      if ((g.features || []).length) {
        html += "<h2>特点</h2><ul>" + g.features.map(function (f) { return "<li>" + esc(customerText(f)) + "</li>"; }).join("") + "</ul>";
      }
      if ((g.applications || []).length) {
        html += "<h2>用途</h2><ul>" + g.applications.map(function (f) { return "<li>" + esc(customerText(f)) + "</li>"; }).join("") + "</ul>";
      }
    }
    if (wantIndustry) {
      const list = industriesOf(g);
      const pick = indSel && indSel.value && indSel.value !== "all" ? [industryById(g, indSel.value)] : list;
      pick.forEach(function (ind) { if (ind) html += printIndustryHtml(ind); });
    }
    if (wantCompare) {
      if (g.core && (g.competitors || []).length) {
        html += "<h2>竞品对照</h2><table><thead><tr><th>项目</th><th>" + esc(g.grade) + "</th>";
        g.competitors.forEach(function (c) { html += "<th>" + esc(c.name || c.grade) + "</th>"; });
        html += "</tr></thead><tbody>";
        const ckeys = keys.slice();
        g.competitors.forEach(function (c) {
          Object.keys(c.properties || {}).forEach(function (k) { if (ckeys.indexOf(k) < 0) ckeys.push(k); });
        });
        ckeys.forEach(function (k) {
          if (k === "film_note") return;
          const selfP = displayValue(props[k], k);
          const any = isPresent(props[k]) || (g.competitors || []).some(function (c) { return isPresent((c.properties || {})[k]); });
          if (!any) return;
          html += "<tr><th>" + esc(PROP_LABEL[k] || k) + "</th>";
          const a = displayValue(props[k], k);
          html += "<td>" + esc(a.text) + (a.unit && a.text !== "—" ? " " + esc(a.unit) : "") + "</td>";
          g.competitors.forEach(function (c) {
            const b = displayValue((c.properties || {})[k], k);
            html += "<td>" + esc(b.text) + (b.unit && b.text !== "—" ? " " + esc(b.unit) : "") + "</td>";
          });
          html += "</tr>";
        });
        html += "</tbody></table>";
      } else if (g.peers && g.peers.length) {
        html += "<h2>同类可对标牌号（自动匹配，仅供参考）</h2>";
        html += "<p>" + esc(g.peers_note || "") + "</p>";
        html += "<table><thead><tr><th>牌号</th><th>厂家</th><th>熔指</th><th>密度</th></tr></thead><tbody>";
        const selfM = displayValue(propOf(g, "mfr"), "mfr");
        const selfD = displayValue(propOf(g, "density"), "density");
        html += "<tr><th>" + esc(g.grade) + "</th><td>" + esc(g.maker) + "</td><td>" + esc(selfM.text) + "</td><td>" + esc(selfD.text) + "</td></tr>";
        g.peers.forEach(function (p) {
          const dens = (p.density_gcm3 != null) ? Number(p.density_gcm3).toFixed(3) : prettyText(p.density);
          html += "<tr><th>" + esc(p.grade) + "</th><td>" + esc(p.maker) + "</td><td>" + esc(prettyText(p.mfr)) + "</td><td>" + esc(dens) + "</td></tr>";
        });
        html += "</tbody></table>";
      }
    }
    if (wantQuote) {
      const total = (parseFloat(q.price) || 0) * (parseFloat(q.qty) || 0);
      html += "<h2>报价</h2><table>";
      html += "<tr><th>牌号</th><td>" + esc(g.grade) + "</td></tr>";
      if (q.customer) html += "<tr><th>客户</th><td>" + esc(q.customer) + "</td></tr>";
      html += "<tr><th>单价</th><td>" + (q.price ? esc(formatMoney(parseFloat(q.price))) + " 元/吨" : "—") + "</td></tr>";
      html += "<tr><th>数量</th><td>" + (q.qty ? esc(q.qty) + " 吨" : "—") + "</td></tr>";
      html += "<tr><th>合计</th><td>" + (total ? esc(formatYuan(total)) : "—") + "</td></tr>";
      if (q.delivery) html += "<tr><th>交期</th><td>" + esc(q.delivery) + "</td></tr>";
      if (q.validity) html += "<tr><th>报价有效期</th><td>" + esc(q.validity) + "</td></tr>";
      if (q.remarks) html += "<tr><th>备注</th><td>" + esc(q.remarks) + "</td></tr>";
      html += "<tr><th>日期</th><td>" + esc(formatDateCN(new Date())) + "</td></tr>";
      html += "</table>";
    }
    html += '<p class="print-foot">以上物性为来源文件中的典型/代表值，非保证规格，仅供参考。测试方法与样条条件不同时，数值不可直接对比或作为替代依据。</p>';
    document.getElementById("print-sheet").innerHTML = html;
  }
  window.__wbPreparePrint = function (gradeId) {
    const g = byId[gradeId] || byId[String(gradeId)];
    if (g) preparePrint(g);
  };

  function render() {
    const route = parseRoute();
    document.getElementById("search-pop").hidden = true;
    if (route.page === "grade") {
      const g = byId[route.id] || GRADES.filter(function (x) { return x.grade === route.id; })[0];
      if (!g) { toast("未找到该牌号"); goHome(); return; }
      document.title = g.grade + " · 文博塑料牌号资料库";
      const search = document.getElementById("search");
      if (document.activeElement !== search) search.value = "";
      renderDetail(g);
    } else {
      applyHomeParams(route.params || {});
      document.title = "文博塑料 · 牌号资料库";
      const search = document.getElementById("search");
      if (document.activeElement !== search) search.value = state.query || "";
      renderHome();
    }
    const cnt = document.getElementById("nav-count");
    if (cnt) cnt.textContent = GRADES.length + " 个牌号";
  }

  function bindGlobal() {
    const search = document.getElementById("search");
    const pop = document.getElementById("search-pop");
    search.addEventListener("input", function () { renderSearchPop(); });
    search.addEventListener("focus", function () { if (search.value) renderSearchPop(); });
    search.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { pop.hidden = true; search.blur(); }
      if (e.key === "Enter") {
        e.preventDefault();
        const q = search.value.trim();
        const hits = runSearch(q);
        pop.hidden = true;
        if (hits.length === 1) { goGrade(hits[0].id); }
        else { state.query = q; state.page = 1; goHome(homeParamsFromState()); }
      }
    });
    pop.addEventListener("click", function (e) {
      const b = e.target.closest("[data-id]");
      if (!b) return;
      pop.hidden = true;
      goGrade(b.getAttribute("data-id"));
    });
    document.addEventListener("click", function (e) {
      if (!e.target.closest(".search-wrap")) pop.hidden = true;
    });
    window.addEventListener("hashchange", render);
    document.getElementById("brand-link").addEventListener("click", function (e) {
      e.preventDefault();
      state.query = ""; state.maker = ""; state.type = ""; state.quality = "all"; state.page = 1;
      goHome();
    });
  }

  bindGlobal();
  render();

})();
  </script>
</body>
</html>
