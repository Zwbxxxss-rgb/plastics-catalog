<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>文博塑料 · 牌号资料库</title>
  <style>

:root {
  --bg: #f3f1ec;
  --bg-accent: #ebe7e0;
  --surface: #fffcf8;
  --surface-2: #f7f4ee;
  --ink: #1c1916;
  --ink-2: #4a453e;
  --ink-3: #7a746b;
  --line: #e6e1d8;
  --line-2: #d4cec4;
  --brand: #1a4548;
  --brand-2: #2a6a6e;
  --brand-soft: #e7f1f1;
  --brand-ink: #123538;
  --copper: #b85e28;
  --copper-soft: #f8eee6;
  --navy: #1e3f63;
  --navy-soft: #e8eef6;
  --ok: #1a6b4a;
  --ok-bg: #e6f4ed;
  --mid: #1d4f86;
  --mid-bg: #e8f0f8;
  --ref: #7a5c1e;
  --ref-bg: #f6f0e0;
  --no: #8f2f2f;
  --no-bg: #f8ecec;
  --shadow: 0 1px 2px rgba(28, 25, 22, 0.04), 0 10px 28px rgba(28, 25, 22, 0.06);
  --shadow-hover: 0 2px 6px rgba(28, 25, 22, 0.06), 0 16px 36px rgba(28, 25, 22, 0.10);
  --radius: 16px;
  --radius-sm: 10px;
  --nav-h: 68px;
  --font: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC",
    "Microsoft YaHei UI", "Microsoft YaHei", "Helvetica Neue", system-ui, sans-serif;
  --mono: "SF Mono", "Menlo", "Consolas", "Sarasa Gothic SC", "Noto Sans Mono CJK SC", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(1100px 520px at 8% -8%, rgba(42, 106, 110, 0.10), transparent 55%),
    radial-gradient(900px 420px at 100% 0%, rgba(184, 94, 40, 0.06), transparent 50%),
    var(--bg);
  min-height: 100vh;
  line-height: 1.6;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select { font-family: inherit; }
button { cursor: pointer; }
a { color: var(--brand-2); text-decoration: none; }
a:hover { color: var(--brand); }

.app { min-height: 100vh; display: flex; flex-direction: column; }

/* ——— Nav ——— */
.nav {
  position: sticky;
  top: 0;
  z-index: 40;
  height: var(--nav-h);
  background: rgba(255, 252, 248, 0.86);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}
.nav-inner {
  max-width: 1180px;
  height: 100%;
  margin: 0 auto;
  padding: 0 28px;
  display: flex;
  align-items: center;
  gap: 28px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--brand-ink);
  font-weight: 600;
  font-size: 15.5px;
  letter-spacing: 0.01em;
  white-space: nowrap;
  flex-shrink: 0;
}
.brand:hover { color: var(--brand-ink); }
.brand-mark {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: linear-gradient(160deg, #2a6a6e, #1a4548);
  color: #f7f4ee;
  display: grid;
  place-items: center;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
}
.search-wrap {
  position: relative;
  flex: 1;
  max-width: 520px;
  margin-left: auto;
}
.search-wrap input {
  width: 100%;
  height: 42px;
  border: 1px solid var(--line-2);
  background: #fff;
  border-radius: 999px;
  padding: 0 16px 0 42px;
  font-size: 14px;
  color: var(--ink);
  outline: none;
  transition: border-color .18s, box-shadow .18s;
}
.search-wrap input::placeholder { color: #9a948b; }
.search-wrap input:focus {
  border-color: #8ab3b5;
  box-shadow: 0 0 0 3px rgba(42, 106, 110, 0.16);
}
.search-icon {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--ink-3);
  pointer-events: none;
}
.search-pop {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow-hover);
  overflow: hidden;
  z-index: 50;
}
.search-item {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  padding: 11px 14px;
  color: var(--ink);
  border-bottom: 1px solid var(--line);
}
.search-item:last-child { border-bottom: 0; }
.search-item:hover, .search-item.active { background: var(--brand-soft); }
.search-item .si-name { font-weight: 600; font-size: 13.5px; letter-spacing: 0.01em; }
.search-item .si-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.search-item .si-tag {
  flex-shrink: 0;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--ink-2);
  margin-top: 2px;
}
.search-empty, .search-hint {
  padding: 14px 16px;
  color: var(--ink-3);
  font-size: 13px;
}

/* ——— Main ——— */
.main {
  flex: 1;
  max-width: 1180px;
  width: 100%;
  margin: 0 auto;
  padding: 28px 28px 48px;
}
.view { animation: rise .32s ease; }
@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .view { animation: none; }
  html { scroll-behavior: auto; }
}

/* ——— Home ——— */
.home-hero { margin-bottom: 8px; }
.eyebrow {
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--brand-2);
  font-weight: 600;
  margin: 0 0 8px;
}
.home-hero h1 {
  font-size: 34px;
  line-height: 1.2;
  font-weight: 650;
  letter-spacing: -0.02em;
  margin: 0 0 8px;
  color: var(--ink);
}
.home-hero p {
  margin: 0;
  color: var(--ink-2);
  font-size: 15.5px;
  max-width: 36em;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 28px 0 22px;
}
.chip {
  border: 1px solid var(--line-2);
  background: var(--surface);
  color: var(--ink-2);
  height: 34px;
  padding: 0 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
}
.chip:hover { border-color: var(--brand-2); color: var(--brand); }
.chip.active {
  background: var(--brand);
  border-color: var(--brand);
  color: #f6fffe;
  box-shadow: 0 1px 2px rgba(26, 69, 72, 0.25);
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
.card {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 18px 14px;
  box-shadow: var(--shadow);
  text-align: left;
  color: inherit;
  min-height: 216px;
  position: relative;
  overflow: hidden;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--cat, var(--brand-2));
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-hover);
  border-color: #c9d6d4;
}
.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.card-id {
  font-size: 22px;
  font-weight: 650;
  letter-spacing: 0.01em;
  line-height: 1.2;
  margin: 0;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.cat-pill {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 999px;
  white-space: nowrap;
  background: var(--cat-bg, var(--brand-soft));
  color: var(--cat-ink, var(--brand));
}
.card-maker { margin: 0 0 8px; font-size: 13px; color: var(--ink-3); }
.card-line { margin: 0 0 12px; font-size: 13.5px; color: var(--ink-2); line-height: 1.55; flex: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.tag {
  font-size: 11.5px;
  color: var(--ink-2);
  background: var(--surface-2);
  border: 1px solid var(--line);
  padding: 2px 8px;
  border-radius: 999px;
}
.specs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: auto;
}
.specs.cols-2 { grid-template-columns: repeat(2, 1fr); }
.spec .sv {
  font-size: 16px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  letter-spacing: -0.01em;
  line-height: 1.2;
}
.spec .su { font-size: 11px; color: var(--ink-3); font-weight: 500; margin-left: 2px; }
.spec .sl { display: block; font-size: 11px; color: var(--ink-3); margin-top: 3px; }

/* ——— Detail ——— */
.back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-2);
  font-size: 13.5px;
  font-weight: 500;
  background: none;
  border: 0;
  padding: 0;
  margin-bottom: 22px;
}
.back:hover { color: var(--brand); }
.jump-note {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--brand-soft);
  border: 1px solid #cfe0e0;
  color: var(--brand-ink);
  border-radius: 12px;
  padding: 11px 14px;
  font-size: 13.5px;
  margin-bottom: 20px;
}
.hero {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 18px;
}
.hero-left { min-width: 0; flex: 1; }
.hero h1 {
  margin: 0 0 6px;
  font-size: 40px;
  line-height: 1.1;
  font-weight: 650;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.hero-meta {
  color: var(--ink-2);
  font-size: 15px;
  margin: 0 0 12px;
}
.hero-meta span + span::before {
  content: "·";
  margin: 0 8px;
  color: var(--ink-3);
}
.hero-actions {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
  flex-shrink: 0;
  min-width: 240px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 42px;
  padding: 0 16px;
  border-radius: 11px;
  font-size: 14px;
  font-weight: 600;
  border: 1px solid transparent;
  transition: transform .12s, background .15s, box-shadow .15s;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: var(--brand);
  color: #f7fffe;
  box-shadow: 0 1px 2px rgba(26, 69, 72, 0.3);
}
.btn-primary:hover { background: #15383b; color: #f7fffe; }
.btn-ghost {
  background: var(--surface);
  border-color: var(--line-2);
  color: var(--ink-2);
}
.btn-ghost:hover { border-color: var(--brand-2); color: var(--brand); }
.select {
  height: 42px;
  border-radius: 11px;
  border: 1px solid var(--line-2);
  background: var(--surface);
  padding: 0 12px;
  font-size: 13px;
  color: var(--ink-2);
  outline: none;
  width: 100%;
}
.select:focus { border-color: #8ab3b5; box-shadow: 0 0 0 3px rgba(42, 106, 110, 0.16); }

.section { margin-bottom: 28px; }
.section h2 {
  font-size: 15px;
  font-weight: 650;
  margin: 0 0 14px;
  color: var(--ink);
  letter-spacing: 0.02em;
}
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 22px;
}

.prop-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.prop-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px 15px;
  box-shadow: 0 1px 2px rgba(28,25,22,0.03);
  min-height: 96px;
  display: flex;
  flex-direction: column;
}
.prop-card .pl {
  font-size: 12px;
  color: var(--ink-3);
  margin-bottom: 8px;
}
.prop-card .pv {
  font-size: 24px;
  font-weight: 650;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
  color: var(--ink);
}
.prop-card .pv .u {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-3);
  letter-spacing: 0;
  margin-left: 4px;
}
.prop-card .pm {
  margin-top: auto;
  padding-top: 8px;
  font-size: 11px;
  color: var(--ink-3);
  line-height: 1.4;
}

.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.list { margin: 0; padding: 0; list-style: none; }
.list li {
  position: relative;
  padding: 0 0 9px 16px;
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.55;
}
.list li:last-child { padding-bottom: 0; }
.list li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.62em;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--brand-2);
  opacity: 0.7;
}

.source-box {
  background: var(--surface-2);
  border: 1px dashed var(--line-2);
  border-radius: 14px;
  padding: 14px 18px;
  font-size: 13px;
  color: var(--ink-2);
}
.source-box strong { color: var(--ink); font-weight: 650; }
.source-box ul { margin: 6px 0 0; padding-left: 18px; }
.source-box li { margin: 3px 0; }

.warn {
  background: var(--ref-bg);
  border: 1px solid #ead9b0;
  color: #5c4514;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 13.5px;
  margin-bottom: 14px;
  line-height: 1.55;
}

/* table */
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  box-shadow: var(--shadow);
}
table.cmp {
  width: 100%;
  border-collapse: collapse;
  min-width: 720px;
  font-size: 13px;
}
table.cmp th, table.cmp td {
  padding: 11px 12px;
  text-align: left;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
table.cmp th {
  background: var(--surface-2);
  font-weight: 650;
  font-size: 12.5px;
  color: var(--ink);
}
table.cmp tr:last-child td { border-bottom: 0; }
table.cmp td.num, table.cmp th.num { font-variant-numeric: tabular-nums; }
table.cmp .ours { background: #f3f8f8; }
table.cmp th.sticky, table.cmp td.sticky {
  position: sticky;
  left: 0;
  background: var(--surface);
  z-index: 1;
  min-width: 108px;
  box-shadow: 4px 0 8px -6px rgba(28,25,22,0.12);
}
table.cmp th.sticky { background: var(--surface-2); }
table.cmp td.ours, table.cmp th.ours { background: #eef5f5; }
table.cmp th.ours.sticky { background: #e8f1f1; }
.th-grade { display: block; font-weight: 650; }
.th-maker { display: block; font-weight: 400; color: var(--ink-3); font-size: 11px; margin-top: 2px; }
.cell-val { font-weight: 550; color: var(--ink); }
.cell-unit { color: var(--ink-3); font-size: 11px; }
.cell-miss { color: #b0aaa2; }
.note-row td { color: var(--ink-2); font-size: 12.5px; line-height: 1.5; background: #fbfaf7; }

.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 650;
  padding: 2px 8px;
  border-radius: 999px;
  margin-top: 6px;
  white-space: nowrap;
}
.badge-closest { background: var(--ok-bg); color: var(--ok); }
.badge-alt { background: var(--mid-bg); color: var(--mid); }
.badge-ref { background: var(--ref-bg); color: var(--ref); }
.badge-no { background: var(--no-bg); color: var(--no); }

/* bars */
.chart-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.seg {
  display: inline-flex;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 3px;
  gap: 2px;
}
.seg button {
  border: 0;
  background: transparent;
  height: 30px;
  padding: 0 12px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 550;
  color: var(--ink-2);
}
.seg button.active {
  background: var(--surface);
  color: var(--brand-ink);
  box-shadow: 0 1px 2px rgba(28,25,22,0.08);
}
.bar-row {
  display: grid;
  grid-template-columns: 148px 1fr 86px;
  gap: 12px;
  align-items: center;
  margin: 9px 0;
}
.bar-name { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-name.ours { color: var(--brand-ink); font-weight: 650; }
.bar-track {
  height: 10px;
  background: #ece8e1;
  border-radius: 999px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 999px;
  background: #c5cdc9;
  width: 0;
  transition: width .45s ease;
}
.bar-fill.ours { background: linear-gradient(90deg, #2a6a6e, #1a4548); }
.bar-val { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink-2); text-align: right; }
.bar-empty { font-size: 13px; color: var(--ink-3); padding: 8px 0; }

/* quote */
.quote details {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 4px 18px 4px;
}
.quote summary {
  cursor: pointer;
  font-weight: 650;
  font-size: 14px;
  padding: 12px 0;
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--ink);
}
.quote summary::-webkit-details-marker { display: none; }
.quote summary::after {
  content: "展开";
  font-weight: 500;
  font-size: 12px;
  color: var(--ink-3);
}
.quote details[open] summary::after { content: "收起"; }
.quote-body { padding: 0 0 16px; }
.quote-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
}
.field label {
  display: block;
  font-size: 12px;
  color: var(--ink-3);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  height: 40px;
  border: 1px solid var(--line-2);
  border-radius: 10px;
  padding: 0 12px;
  font-size: 14px;
  background: #fff;
  outline: none;
  font-variant-numeric: tabular-nums;
}
.field input:focus { border-color: #8ab3b5; box-shadow: 0 0 0 3px rgba(42, 106, 110, 0.16); }
.total-box {
  height: 40px;
  display: flex;
  align-items: center;
  font-size: 18px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  color: var(--brand-ink);
}
.quote-hint { margin: 8px 0 0; font-size: 12px; color: var(--ink-3); }

/* footer + toast */
.site-footer {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 28px 40px;
  color: var(--ink-3);
  font-size: 12.5px;
  line-height: 1.6;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%) translateY(8px);
  background: var(--brand-ink);
  color: #f6fffe;
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 550;
  box-shadow: var(--shadow-hover);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 80;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.muted { color: var(--ink-3); }

@media (max-width: 980px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
  .prop-grid { grid-template-columns: repeat(2, 1fr); }
  .split, .quote-grid { grid-template-columns: 1fr; }
  .hero { flex-direction: column; }

    jumpedFrom: "",
    searchOpen: false,
    searchHits: [],
    activeHit: 0,
    industryId: ""
  };

  const $navSearch = document.getElementById("search");
  const $searchPop = document.getElementById("search-pop");
  const $main = document.getElementById("main");
  const $toast = document.getElementById("toast");
  const $filters = document.getElementById("filters");

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function metaOf(id) { return META[id] || {}; }
  function industriesOf(g) {
    const id = typeof g === "string" ? g : (g && g.grade);
    return (INDUSTRIES[id] || []).slice();
  }
  function industryById(g, id) {
    const list = industriesOf(g);
    if (!list.length) return null;
    return list.filter(function (x) { return x.id === id; })[0] || list[0];
  }

  function catOf(id) { return CAT[metaOf(id).category] || CAT.mpe; }
  function matchOf(ours, theirs) {
    const exact = MATCH[ours + "|" + theirs];
    if (exact) return exact;
    const prefix = ours + "|";
    for (const k in MATCH) {
      if (k.indexOf(prefix) !== 0) continue;
      const name = k.slice(prefix.length);
      if (theirs === name || theirs.indexOf(name) === 0 || name.indexOf(theirs) === 0) return MATCH[k];
    }
    return "";
  }

  function prettyUnit(u) {
    if (!u) return "";
    return String(u)
      .replace(/g\/10\s*min/ig, "g/10 min")
      .replace(/kg\/m[³3]/g, "kg/m³")
      .replace(/kJ\/m[²2]/g, "kJ/m²")
      .replace(/g\/cm[³3]/g, "g/cm³");
  }

  function prettyText(val) {
    const t = String(val).trim();
    const lower = t.toLowerCase();
    if (t === "NB" || lower === "no-break" || lower === "no break" || lower === "nobreak") {
      return { text: "未破", dropUnit: true };
    }
    if (lower === "no-yield" || lower === "no yield" || lower === "noyield") {
      return { text: "无屈服", dropUnit: true };
    }
    return { text: t, dropUnit: false };
  }

  function isPresent(p) {
    if (p == null) return false;
    if (typeof p === "string") return p.trim() !== "";
    if (typeof p !== "object") return p !== "" && p != null;
    if (p.value == null || p.value === "") return false;
    if (typeof p.value === "string" && /^[—–\-]$/.test(p.value.trim())) return false;
    return true;
  }

  function propOf(obj, key) {
    const props = obj && obj.properties ? obj.properties : null;
    if (!props) return null;
    return props[key] || null;
  }

  function displayValue(p) {
    if (!isPresent(p)) return { text: "—", unit: "", method: "", note: "", missing: true };
    if (typeof p === "string") {
      const pt = prettyText(p);
      return { text: pt.text, unit: "", method: "", note: "", missing: false };
    }
    const pt = prettyText(p.value);
    const unit = pt.dropUnit ? "" : prettyUnit(p.unit || "");
    const methodParts = [];
    if (p.condition) methodParts.push(p.condition);
    if (p.method) methodParts.push(p.method);
    return {
      text: pt.text,
      unit: unit,
      method: methodParts.join(" · "),
      note: p.note || "",
      missing: false
    };
  }

  function numericOf(p) {
    if (!isPresent(p)) return null;
    if (typeof p === "number") return p;
    const raw = typeof p === "object" ? p.value : p;
    if (typeof raw === "number" && isFinite(raw)) return raw;
    const s = String(raw).trim();
    const m = s.match(/-?\d+(\.\d+)?/);
    if (!m) return null;
    const n = parseFloat(m[0]);
    return isFinite(n) ? n : null;
  }

  function densityNorm(p) {
    if (!isPresent(p)) return { n: null, label: null, unit: "g/cm³" };
    const d = displayValue(p);
    let n = numericOf(p);
    let unit = (typeof p === "object" && p.unit) ? p.unit : "";
    if (n != null && unit && /kg\s*\/\s*m/i.test(unit)) {
      n = n / 1000;
      unit = "g/cm³";
      return { n: n, label: n.toFixed(3), unit: prettyUnit(unit) || "g/cm³" };
    }
    if (n != null && n > 5) {
      n = n / 1000;
      unit = "g/cm³";
      return { n: n, label: n.toFixed(3), unit: prettyUnit(unit) || "g/cm³" };
    }
    return { n: n, label: (n != null ? n.toFixed(3) : d.text), unit: prettyUnit(unit) || "g/cm³" };
  }

  function formatHeadline(obj, key) {
    const p = propOf(obj, key);
    if (key === "density") {
      const d = densityNorm(p);
      if (d.n == null && !isPresent(p)) return { label: PROP_LABEL[key] || key, text: "—", unit: "" };
      return { label: "密度", text: d.label || "—", unit: d.unit || "" };
    }
    const d = displayValue(p);
    return { label: PROP_LABEL[key] || key, text: d.text, unit: d.unit };
  }

  function sourceName(s) {
    if (!s) return "";
    if (s.path) {
      const parts = String(s.path).split(/[/\\]/);
      return parts[parts.length - 1];
    }
    return s.title || s.url || "";
  }

  function primarySource(g) {
    const sources = g.sources || [];
    if (!sources.length) return "公开技术资料";
    const first = sources[0];
    const file = sourceName(first);
    return first.title + (file && first.path ? "（" + file + "）" : "");
  }

  function propKeysFor(g) {
    const keys = Object.keys(g.properties || {});
    const skip = { film_note: 1, notes: 1, comment: 1, source: 1 };
    return keys.filter(function (k) {
      if (skip[k]) return false;
      return isPresent(g.properties[k]);
    });
  }

  function unionPropKeys(g) {
    const seen = [];
    function add(k) {
      if (seen.indexOf(k) === -1) seen.push(k);
    }
    propKeysFor(g).forEach(add);
    (g.competitors || []).forEach(function (c) {
      Object.keys(c.properties || {}).forEach(function (k) {
        if (k === "film_note" || k === "notes" || k === "comment") return;
        if (isPresent(c.properties[k])) add(k);
      });
    });
    const preferred = [
      "mfr", "mfr_himilan", "mfr_surlyn", "density", "density_himilan", "density_surlyn",
      "gma_content", "ma_content", "maa_content", "acrylate_content", "ba_content", "va_content",
      "vicat", "vicat_himilan", "melting_point", "melting_point_surlyn", "hdt", "tg", "brittleness_temperature",
      "tensile_strength", "tensile_strength_yield", "tensile_strength_break", "tensile_elongation_break",
      "tensile_strength_yield_film_md_td", "tensile_strength_break_film_md_td", "tensile_elongation_break_film_md_td",
      "flexural_modulus", "flexural_rigidity", "secant_modulus_1pct_md_td", "shore_d", "shore_d_himilan",
      "izod_impact", "charpy_impact", "dart_drop", "elmendorf_tear_md_td",
      "escr", "haze", "gloss_45", "heat_seal_initiation", "melt_tension", "water_absorption"
    ];
    seen.sort(function (a, b) {
      const ia = preferred.indexOf(a);
      const ib = preferred.indexOf(b);
      if (ia === -1 && ib === -1) return a.localeCompare(b);
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });
    return seen;
  }

  function loadQuotes() {
    try {
      return JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {};
    } catch (e) {
      return {};
    }
  }
  function saveQuotes(q) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(q)); } catch (e) {}
  }
  function emptyQuote() {
    return {
      customer: "", price: "", qty: "", delivery: "", validity: "", remarks: "",
      includeInfo: true, includeCmp: true, includeQuote: true,
      includeIndustry: true, industrySel: "", comps: null
    };
  }
  function formatMoney(n) {
    if (n == null || !isFinite(n)) return "—";
    return n.toLocaleString("zh-CN", { maximumFractionDigits: 2, minimumFractionDigits: 0 }) + " 元";
  }
  function formatYuan(n) {
    if (n == null || !isFinite(n)) return "—";
    return n.toLocaleString("zh-CN", { maximumFractionDigits: 2, minimumFractionDigits: 0 });
  }
  function formatDateCN(isoOrDate) {
    if (!isoOrDate) return "—";
    var d;
    if (isoOrDate instanceof Date) d = isoOrDate;
    else {
      const s = String(isoOrDate);
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return m[1] + "年" + Number(m[2]) + "月" + Number(m[3]) + "日";
      d = new Date(s);
    }
    if (isNaN(d.getTime())) return "—";
    return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
  }

  function filenameSafe(s) {
    return String(s || "")
      .replace(/（[^）]*）/g, "")
      .replace(/\([^)]*\)/g, "")
      .replace(/[\\/:*?"<>|]+/g, "")
      .replace(/\s+/g, "")
      .replace(/_+/g, "_")
      .replace(/^_|_$/g, "")
      .slice(0, 24);
  }
  function suggestPdfTitle(g, q) {
    const parts = [];
    if (q.includeInfo) parts.push("资料");
    if (q.includeCmp) parts.push("对比");
    if (q.includeQuote) parts.push("报价");
    if (q.includeIndustry) parts.push("行业用途");
    const mid = parts.join("与") || "资料";
    const customer = filenameSafe(q.customer || "");
    const d = new Date();
    const date = String(d.getFullYear()) + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
    const segs = [g.grade, mid];
    if (customer) segs.push(customer);
    segs.push(date);
    return segs.join("_");
  }
  function customerText(s) {
    var text = String(s || "");
    text = text.replace(/（[^）]*(系列总表|用户原件|主数据源|物性汇总|单页\s*TDS|官方总表|本批|本轮|原件)[^）]*）/g, "");
    text = text.replace(/是本批里/g, "是");
    text = text.replace(/\s{2,}/g, " ").replace(/[，、；]\s*$/g, "").trim();
    return text;
  }

  function parseRoute() {
    const raw = (location.hash || "#/").replace(/^#/, "");
    const [path, query] = raw.split("?");
    const parts = path.split("/").filter(Boolean);
    const params = {};
    if (query) {
      query.split("&").forEach(function (kv) {
        const i = kv.indexOf("=");
        if (i === -1) params[decodeURIComponent(kv)] = "";
        else params[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
      });
    }
    if (parts[0] === "grade" && parts[1]) {
      return { view: "grade", id: parts[1], vs: params.vs || "", from: params.from || "" };
    }
    return { view: "home", id: null, vs: "", from: "" };
  }

  function goHome() {
    location.hash = "#/";
  }
  function goGrade(id, extra) {
    let h = "#/grade/" + encodeURIComponent(id);
    const q = [];
    if (extra && extra.vs) q.push("vs=" + encodeURIComponent(extra.vs));
    if (extra && extra.from) q.push("from=" + encodeURIComponent(extra.from));
    if (q.length) h += "?" + q.join("&");
    location.hash = h;
  }

  function norm(s) {
    return String(s || "").toLowerCase().replace(/\s+/g, " ").trim();
  }

  function searchIndex() {
    const items = [];
    GRADES.forEach(function (g) {
      const m = metaOf(g.grade);
      const hay = [
        g.grade, g.brand, g.manufacturer, g.polymer_type,
        m.line, m.makerShort, (m.tags || []).join(" "), (m.aliases || []).join(" "),
        (g.typical_applications || []).join(" "), (g.features || []).join(" ")
      ].join(" ");
      items.push({
        type: "ours",
        gradeId: g.grade,
        title: g.grade,
        sub: (m.makerShort || g.manufacturer) + " · " + (catOf(g.grade).label),
        tag: "我方牌号",
        hay: hay
      });
      (g.competitors || []).forEach(function (c) {
        const chay = [c.grade, c.brand, c.manufacturer, c.match_note, c.note, JSON.stringify(c.aliases || [])].join(" ");
        items.push({
          type: "comp",
          gradeId: g.grade,
          compName: c.grade,
          title: shortName(c.grade),
          sub: (c.manufacturer || c.brand || "") + " → " + g.grade,
          tag: matchOf(g.grade, c.grade) || "竞品",
          hay: chay + " " + hay
        });
      });
    });
    return items;
  }

  const INDEX = searchIndex();

  function shortName(name) {
    if (!name) return "";
    const cut = name.split("（")[0].split("(")[0].trim();
    return cut.length > 36 ? cut.slice(0, 34) + "…" : cut;
  }
  function shortMaker(s) {
    if (!s) return "";
    const m = String(s).match(/（([^）]+)）/);
    let label = m ? m[1] : String(s);
    if (label.length > 10 && label.indexOf("/") !== -1) {
      label = label.split("/").pop().trim();
    }
    if (label.length > 14) label = label.slice(0, 13) + "…";
    return label;
  }

  function runSearch(q) {
    const nq = norm(q);
    if (!nq) return [];
    const hits = [];
    INDEX.forEach(function (it) {
      const hay = norm(it.hay + " " + it.title);
      const score =
        norm(it.title) === nq ? 100 :
        norm(it.title).indexOf(nq) === 0 ? 80 :
        norm(it.title).indexOf(nq) !== -1 ? 60 :
        hay.indexOf(nq) !== -1 ? 40 : 0;
      if (score) hits.push({ item: it, score: score });
    });
    hits.sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      if (a.item.type !== b.item.type) return a.item.type === "ours" ? -1 : 1;
      return a.item.title.localeCompare(b.item.title);
    });
    const seen = {};
    const out = [];
    hits.forEach(function (h) {
      const k = h.item.type + "|" + h.item.gradeId + "|" + (h.item.compName || "");
      if (seen[k]) return;
      seen[k] = 1;
      out.push(h.item);
    });
    return out.slice(0, 8);
  }

  function renderSearchPop() {
    const q = $navSearch.value.trim();
    if (!state.searchOpen) {
      $searchPop.hidden = true;
      $searchPop.innerHTML = "";
      return;
    }
    const hits = q ? runSearch(q) : [];
    state.searchHits = hits;
    if (!q) {
      $searchPop.hidden = false;
      $searchPop.innerHTML = '<div class="search-hint">可搜索我方牌号或竞品，如 SP2320、ELITE 5811、AX8840</div>';
      return;
    }
    if (!hits.length) {
      $searchPop.hidden = false;
      $searchPop.innerHTML = '<div class="search-empty">没有找到匹配的牌号</div>';
      return;
    }
    if (state.activeHit >= hits.length) state.activeHit = 0;
    $searchPop.hidden = false;
    $searchPop.innerHTML = hits.map(function (it, i) {
      return '<button type="button" class="search-item' + (i === state.activeHit ? " active" : "") + '" data-i="' + i + '">' +
        '<span><span class="si-name">' + esc(it.title) + '</span><span class="si-sub">' + esc(it.sub) + '</span></span>' +
        '<span class="si-tag">' + esc(it.tag) + '</span></button>';
    }).join("");
  }

  function pickHit(it) {
    state.searchOpen = false;
    $searchPop.hidden = true;
    $navSearch.blur();
    if (it.type === "comp") {
      goGrade(it.gradeId, { vs: it.compName, from: it.compName });
    } else {
      goGrade(it.gradeId);
    }
  }

  function toast(msg) {
    $toast.textContent = msg;
    $toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { $toast.classList.remove("show"); }, 2200);
  }

  function renderFilters() {
    const route = parseRoute();
    const sub = document.getElementById("subbar");
    if (sub) sub.hidden = route.view !== "home";
    $filters.hidden = route.view !== "home";
    if (route.view !== "home") return;
    const items = [
      { id: "all", label: "全部" },
      { id: "mpe", label: "茂金属 PE" },
      { id: "ionomer", label: "离子聚合物" },
      { id: "compat", label: "相容剂增韧剂" }
    ];
    $filters.innerHTML = items.map(function (it) {
      return '<button type="button" class="chip' + (state.category === it.id ? " active" : "") + '" data-cat="' + it.id + '">' + esc(it.label) + "</button>";
    }).join("");
  }

  function industryBodyHtml(ind) {
    if (!ind) return "";
    let html = '<p class="industry-pitch">' + esc(ind.pitch) + "</p>";
    html += '<div class="panel" style="margin-bottom:16px"><h2>主要作用</h2><div class="tags" style="margin-bottom:0">';
    (ind.keyBenefits || []).forEach(function (b) { html += '<span class="tag">' + esc(b) + "</span>"; });
    html += "</div></div>";
    html += '<div class="panel" style="margin-bottom:16px"><h2>用在哪些部位</h2><ul class="list">';
    (ind.applications || []).forEach(function (a) { html += "<li>" + esc(a) + "</li>"; });
    html += "</ul></div>";
    html += '<div class="panel"><h2>为何有效</h2>';
    (ind.whyItWorks || []).forEach(function (w) {
      html += '<div class="why-item"><div class="wb">' + esc(w.benefit) + "</div><p>" + esc(w.detail) + "</p></div>";
    });
    html += "</div>";
    if (ind.competitorsNote) {
      html += '<div class="panel" style="margin-top:16px"><h2>本行业竞品对照</h2><p class="industry-comp">' + esc(ind.competitorsNote) + "</p></div>";
    }

  function industrySectionHtml(g) {

    if (!list.length) return "";
    const current = list.some(function (x) { return x.id === state.industryId; }) ? state.industryId : list[0].id;
    state.industryId = current;
    const tabs = list.map(function (ind) {
      return '<button type="button" class="chip' + (ind.id === current ? " active" : "") + '" data-industry="' + esc(ind.id) + '">' + esc(ind.name) + "</button>";
    }).join("");

    return '<section class="section" id="industry-sec"><h2>行业用途</h2>' +
      '<div class="industry-tabs">' + tabs + "</div>" +
      '<div id="industry-body">' + industryBodyHtml(ind) + "</div></section>";

  function printIndustryHtml(ind) {
    if (!ind) return "";
    let html = '<section class="ps-sec"><h2>行业用途 · ' + esc(ind.name) + "</h2>";
    if (ind.pitch) html += '<p class="ps-pitch">' + esc(ind.pitch) + "</p>";
    if (ind.applications && ind.applications.length) {
      html += "<h3 style=\"font-size:10pt;margin:8px 0 4px;color:#1a4548\">用在哪些部位</h3><ul class=\"ps-ul\">";
      ind.applications.forEach(function (a) { html += "<li>" + esc(a) + "</li>"; });
      html += "</ul>";
    }
    if (ind.keyBenefits && ind.keyBenefits.length) {
      html += "<h3 style=\"font-size:10pt;margin:8px 0 4px;color:#1a4548\">主要作用</h3><p class=\"ps-pitch\">" + esc(ind.keyBenefits.join(" · ")) + "</p>";
    }
    if (ind.whyItWorks && ind.whyItWorks.length) {
      html += "<h3 style=\"font-size:10pt;margin:8px 0 4px;color:#1a4548\">为何有效</h3>";
      ind.whyItWorks.forEach(function (w) {
        html += '<p class="ps-why"><strong>' + esc(w.benefit) + "：</strong>" + esc(w.detail) + "</p>";
      });
    }
    if (ind.competitorsNote) {
      html += "<h3 style=\"font-size:10pt;margin:8px 0 4px;color:#1a4548\">本行业竞品对照</h3><p class=\"ps-pitch\">" + esc(ind.competitorsNote) + "</p>";
    }
    if (ind.caveat) html += '<p class="ps-caveat">' + esc(ind.caveat) + "</p>";

  function renderHome() {
    const list = GRADES.filter(function (g) {
      if (state.category !== "all" && metaOf(g.grade).category !== state.category) return false;
      return true;
    });
    const cards = list.map(function (g) {
      const m = metaOf(g.grade);
      const cat = catOf(g.grade);
      const heads = (m.headlines || ["mfr", "density"]).map(function (k) { return formatHeadline(g, k); });
      const cols = heads.length === 2 ? " cols-2" : "";
      return (
        '<button type="button" class="card" data-grade="' + esc(g.grade) + '" style="--cat:' + cat.bar + ';--cat-bg:' + cat.bg + ';--cat-ink:' + cat.ink + '">' +
          '<div class="card-top"><h2 class="card-id">' + esc(g.grade) + '</h2><span class="cat-pill">' + esc(cat.label) + "</span></div>" +
          '<p class="card-maker">' + esc(m.makerShort || g.manufacturer) + '</p>' +
          '<p class="card-line">' + esc(m.line || g.polymer_type) + "</p>" +
          '<div class="tags">' + (m.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") + "</div>" +
          '<div class="specs' + cols + '">' + heads.map(function (h) {
            return '<div class="spec"><span class="sv">' + esc(h.text) + (h.unit ? '<span class="su">' + esc(h.unit) + "</span>" : "") + '</span><span class="sl">' + esc(h.label) + "</span></div>";
          }).join("") + "</div>" +
        "</button>"
      );
    }).join("");
    $main.innerHTML =
      '<div class="view">' +
        '<section class="home-hero">' +
          '<p class="eyebrow">在售牌号 · ' + GRADES.length + " 个</p>" +
          "<h1>客户问起，立刻出资料</h1>" +
          "<p>点选或搜索牌号，即可查看物性、用途、卖点与对标竞品。价格由你来定，数值仅供参考。</p>" +
        "</section>" +
        '<div class="grid">' + (cards || '<p class="muted">该分类下暂无牌号。</p>') + "</div>" +
      "</div>";
  }

  function cellHtml(p, key) {
    if (key === "density") {
      const d = densityNorm(p);
      if (d.n == null && !isPresent(p)) return '<span class="cell-miss">—</span>';
      return '<span class="cell-wrap"><span class="cell-val">' + esc(d.label) + '</span> <span class="cell-unit">' + esc(d.unit) + "</span></span>";
    }
    const d = displayValue(p);
    if (d.missing) return '<span class="cell-miss">—</span>';
    return '<span class="cell-wrap"><span class="cell-val">' + esc(d.text) + "</span>" + (d.unit ? ' <span class="cell-unit">' + esc(d.unit) + "</span>" : "") + "</span>";
  }

  function renderDetail(g) {
    const m = metaOf(g.grade);
    const cat = catOf(g.grade);
    const keys = propKeysFor(g);
    const cmpKeys = unionPropKeys(g);
    const comps = g.competitors || [];
    const vs = state.vs && comps.some(function (c) { return c.grade === state.vs; }) ? state.vs : "";
    const chartKeys = (m.chartKeys || ["mfr", "density"]).filter(function (k) {
      return numericForChart(g, k) != null || comps.some(function (c) { return numericForChart(c, k) != null; });
    });
    if (!state.chartKey || chartKeys.indexOf(state.chartKey) === -1) {
      state.chartKey = chartKeys[0] || "mfr";
    }

    const props = keys.map(function (k) {
      const p = propOf(g, k);
      const d = k === "density" ? (function () {
        const x = densityNorm(p);
        const raw = displayValue(p);
        return { text: x.label || "—", unit: x.unit, method: raw.method, missing: x.n == null && !isPresent(p) };
      })() : displayValue(p);
      return (
        '<div class="prop-card"><div class="pl">' + esc(PROP_LABEL[k] || k) + "</div>" +
        '<div class="pv">' + esc(d.text) + (d.unit ? '<span class="u">' + esc(d.unit) + "</span>" : "") + "</div>" +
        '<div class="pm">' + esc(d.method || "典型值") + "</div></div>"
      );
    }).join("");

    const apps = (g.typical_applications || []).map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");
    const feats = (g.features || []).map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");

    const srcItems = (g.sources || []).map(function (s) {
      const file = s.path ? sourceName(s) : "";
      const title = s.title || "";
      const label = title + (file && title.indexOf(file) === -1 ? " · " + file : "");
      return "<li>" + esc(label) + "</li>";
    }).join("");

    const jump = state.jumpedFrom
      ? '<div class="jump-note">已根据竞品 <strong>' + esc(shortName(state.jumpedFrom)) + "</strong> 定位到我方牌号 " + esc(g.grade) + "，可在下方表格中对照，导出 PDF 时也可勾选该竞品。</div>"
      : "";

    const family = m.familyNote ? '<div class="warn">' + esc(m.familyNote) + "</div>" : "";

    const headCells = ['<th class="sticky">物性</th>', '<th class="ours">我方 · ' + esc(g.grade) + "</th>"]
      .concat(comps.map(function (c) {
        const tag = matchOf(g.grade, c.grade);
        const bc = BADGE_CLASS[tag] || "badge-ref";
        return '<th><span class="th-grade">' + esc(shortName(c.grade)) + '</span><span class="th-maker">' +
          esc(c.manufacturer || c.brand || "") + "</span>" +
          (tag ? '<span class="badge ' + bc + '">' + esc(tag) + "</span>" : "") + "</th>";
      })).join("");

    const bodyRows = cmpKeys.map(function (k) {
      return "<tr><td class=\"sticky\">" + esc(PROP_LABEL[k] || k) + "</td><td class=\"ours num\">" +
        cellHtml(propOf(g, k), k) + "</td>" +
        comps.map(function (c) { return '<td class="num">' + cellHtml(propOf(c, k), k) + "</td>"; }).join("") +
        "</tr>";
    }).join("");

    const noteRow = comps.length
      ? '<tr class="note-row"><td class="sticky">对标说明</td><td class="ours muted">—</td>' +
        comps.map(function (c) {
          const note = c.match_note || c.note || c.comparison_note || "";
          return "<td>" + esc(note || "—") + "</td>";
        }).join("") + "</tr>"
      : "";

    const seg = chartKeys.map(function (k) {
      return '<button type="button" data-chart="' + esc(k) + '" class="' + (state.chartKey === k ? "active" : "") + '">' +
        esc(CHART_LABEL[k] || PROP_LABEL[k] || k) + "</button>";
    }).join("");

    const footnotes = keys.map(function (k) {
      const p = propOf(g, k);
      if (!p || typeof p !== "object" || !p.note) return "";
      const note = String(p.note).trim();
      if (!note) return "";
      if (/^合\s*0\.\d+\s*g/.test(note)) return "";
      const shown = (k === "density" ? (densityNorm(p).label || "") : displayValue(p).text);
      if (shown && note.indexOf(shown) !== -1 && note.length < 24) return "";
      return "<li>" + esc(PROP_LABEL[k] || k) + "：" + esc(note) + "</li>";
    }).filter(Boolean);
    const footnoteBox = footnotes.length
      ? '<ul class="footnotes">' + footnotes.join("") + "</ul>"
      : "";
    const matchCards = comps.map(function (c) {
      const tag = matchOf(g.grade, c.grade);
      const bc = BADGE_CLASS[tag] || "badge-ref";
      const note = c.match_note || c.note || c.comparison_note || "";
      if (!note && !tag) return "";
      return '<div class="match-note"><div class="mh"><strong>' + esc(shortName(c.grade)) + "</strong>" +
        (tag ? '<span class="badge ' + bc + '">' + esc(tag) + "</span>" : "") + "</div><p>" +
        esc(note || "—") + "</p></div>";
    }).join("");

    const q = Object.assign(emptyQuote(), loadQuotes()[g.grade] || {});
    const total = (parseFloat(q.price) || 0) * (parseFloat(q.qty) || 0);
    const includeInfo = q.includeInfo !== false;
    const includeCmp = q.includeCmp !== false;
    const includeQuote = q.includeQuote !== false;
    const indList = industriesOf(g);
    if (indList.length && !indList.some(function (x) { return x.id === state.industryId; })) {
      state.industryId = indList[0].id;
    }
    const includeIndustry = indList.length ? q.includeIndustry !== false : false;
    const industrySel = (q.industrySel && (q.industrySel === "all" || indList.some(function (x) { return x.id === q.industrySel; })))
      ? q.industrySel
      : (state.industryId || (indList[0] && indList[0].id) || "");
    const industryToggle = !indList.length ? "" : (
      '<label><input type="checkbox" id="ex-industry"' + (includeIndustry ? " checked" : "") + "> 行业用途</label>"
    );
    const industrySelHtml = !indList.length ? "" : (
      '<div class="industry-export' + (includeIndustry ? "" : " is-off") + '" id="industry-export">' +
        '<label for="ex-industry-sel">纳入的行业</label>' +
        '<select class="select" id="ex-industry-sel">' +
          '<option value="all"' + (industrySel === "all" ? " selected" : "") + ">全部行业</option>" +
          indList.map(function (ind) {
            return '<option value="' + esc(ind.id) + '"' + (industrySel === ind.id ? " selected" : "") + ">" + esc(ind.name) + "</option>";
          }).join("") +
        "</select></div>"
    );
    const chosen = Array.isArray(q.comps) ? q.comps : comps.map(function (c) { return c.grade; });
    const compChecks = comps.map(function (c) {
      const tag = matchOf(g.grade, c.grade);
      const bc = BADGE_CLASS[tag] || "badge-ref";
      const on = chosen.indexOf(c.grade) !== -1;
      return '<label class="comp-item"><input type="checkbox" data-comp="' + esc(c.grade) + '"' + (on ? " checked" : "") + ">" +
        '<span class="cn">' + esc(shortName(c.grade)) + "</span>" +
        (tag ? '<span class="badge ' + bc + '">' + esc(tag) + "</span>" : "") + "</label>";
    }).join("");

    $main.innerHTML =
      '<div class="view">' +
        '<button type="button" class="back" id="btn-back">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>全部牌号</button>' +
        jump +
        '<div class="hero">' +
          '<div class="hero-left">' +
            "<h1>" + esc(g.grade) + "</h1>" +
            '<p class="hero-maker">' + esc(m.makerShort || g.manufacturer || "") + "</p>" +
            '<p class="hero-type">' + esc(g.polymer_type || "") + "</p>" +
            '<div class="tags">' + (m.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") +
              '<span class="tag">' + esc(cat.label) + "</span></div>" +
          "</div>" +
        "</div>" +

        '<section class="export-dock" id="export-dock">' +
          '<div class="export-col">' +
            "<h2>报价</h2>" +
            '<div class="qf-grid">' +
              '<div class="field span-2"><label>客户名称</label><input id="q-customer" type="text" value="' + esc(q.customer) + '" placeholder="例如 某某包装有限公司" autocomplete="organization"></div>' +
              '<div class="field span-2"><label>报价有效期</label><input id="q-validity" type="date" value="' + esc(q.validity) + '"></div>' +
              '<div class="field"><label>单价（元/吨）</label><input id="q-price" type="number" min="0" step="1" inputmode="decimal" value="' + esc(q.price) + '" placeholder="例如 9800"></div>' +
              '<div class="field"><label>数量（吨）</label><input id="q-qty" type="number" min="0" step="0.01" inputmode="decimal" value="' + esc(q.qty) + '" placeholder="例如 10"></div>' +
              '<div class="field span-2"><label>合计</label><div class="total-box" id="q-total">' + esc(total ? formatMoney(total) : "—") + "</div></div>" +
              '<div class="field span-4"><label>交货条款</label><input id="q-delivery" type="text" value="' + esc(q.delivery) + '" placeholder="例如 自提，或送到指定仓库"></div>' +
              '<div class="field span-4"><label>备注</label><textarea id="q-remarks" placeholder="可选，将写入报价单">' + esc(q.remarks) + "</textarea></div>" +
            "</div>" +
            '<p class="export-hint" style="margin-top:10px">报价保存在本机浏览器，仅用于导出，换设备不会同步。</p>' +
          "</div>" +
          '<div class="export-col">' +
            "<h2>导出 PDF</h2>" +
            '<div class="sec-toggles">' +
              '<label><input type="checkbox" id="ex-info"' + (includeInfo ? " checked" : "") + "> 资料</label>" +
              '<label><input type="checkbox" id="ex-cmp"' + (includeCmp ? " checked" : "") + "> 对比</label>" +
              '<label><input type="checkbox" id="ex-quote"' + (includeQuote ? " checked" : "") + "> 报价</label>" +
              industryToggle +
            "</div>" +
            industrySelHtml +
            '<div class="comp-picks' + (includeCmp ? "" : " is-off") + '" id="comp-picks">' +
              '<div class="comp-picks-head"><span>纳入对比的竞品</span><button type="button" id="ex-comps-all">全选</button></div>' +
              '<div class="comp-list">' + (compChecks || '<span class="muted">暂无竞品</span>') + "</div>" +
            "</div>" +
            '<div class="export-actions">' +
              '<button type="button" class="btn btn-primary" id="btn-export">导出 PDF</button>' +
              '<p class="export-hint">在打印窗口选择「另存为 PDF」。建议关闭页眉页脚，避免打出本机路径。</p>' +
            "</div>" +
          "</div>" +
        "</section>" +

        '<section class="section"><h2>关键物性</h2><div class="prop-grid">' + props + "</div>" + footnoteBox + "</section>" +

        '<section class="section"><div class="split">' +
          '<div class="panel"><h2>典型用途</h2><ul class="list">' + (apps || "<li class=\"muted\">—</li>") + "</ul></div>" +
          '<div class="panel"><h2>卖点</h2><ul class="list">' + (feats || "<li class=\"muted\">—</li>") + "</ul></div>" +
        "</div></section>" +

        industrySectionHtml(g) +

        '<section class="section"><div class="source-box"><strong>资料来源</strong>（主数据源见首条）<ul>' + srcItems + "</ul></div></section>" +

        '<section class="section"><h2>竞品对比</h2>' + family +
          '<p class="swipe-hint">表格可左右滑动，查看全部竞品</p>' +
          '<div class="table-wrap"><table class="cmp"><thead><tr>' + headCells + "</tr></thead><tbody>" + bodyRows + "</tbody></table></div>" +
          (matchCards ? '<div class="match-notes">' + matchCards + "</div>" : "") +
        "</section>" +

        '<section class="section"><div class="panel">' +
          '<div class="chart-head"><h2 style="margin:0">物性对照图</h2>' +
          (seg ? '<div class="seg" id="chart-seg">' + seg + "</div>" : "") + "</div>" +
          '<div id="chart-body">' + renderBars(g, state.chartKey) + "</div>" +
          '<p class="quote-hint">仅展示公开资料中可解析的数值；密度已统一到 g/cm³。测试方法不同，不能直接当作规格对比。</p>' +
        "</div></section>" +

      "</div>";
  }

  function readQuoteForm(g) {
    const get = function (id) {
      const el = document.getElementById(id);
      return el ? el.value : "";
    };
    const checked = function (id, fallback) {
      const el = document.getElementById(id);
      return el ? !!el.checked : fallback;
    };
    const comps = Array.prototype.map.call(
      document.querySelectorAll("#comp-picks input[data-comp]:checked"),
      function (el) { return el.getAttribute("data-comp"); }
    );
    const q = {
      customer: get("q-customer"),
      price: get("q-price"),
      qty: get("q-qty"),
      delivery: get("q-delivery"),
      validity: get("q-validity"),
      remarks: get("q-remarks"),
      includeInfo: checked("ex-info", true),
      includeCmp: checked("ex-cmp", true),
      includeQuote: checked("ex-quote", true),
      includeIndustry: checked("ex-industry", true),
      industrySel: get("ex-industry-sel"),
      comps: comps
    };
    if (g) {
      const all = loadQuotes();
      all[g.grade] = q;
      saveQuotes(all);
    }
    return q;
  }

  function badgeClassPrint(tag) {
    if (tag === "最接近") return "closest";
    if (tag === "可替代") return "alt";
    if (tag === "仅参照") return "ref";
    if (tag === "不能直接替换") return "no";
    return "ref";
  }

  function printPropCells(obj, key) {
    if (key === "density") {
      const d = densityNorm(propOf(obj, key));
      const raw = displayValue(propOf(obj, key));
      if (d.n == null && raw.missing) return { val: "—", unit: "", method: "" };
      return { val: d.label || "—", unit: d.unit || "", method: raw.method || "" };
    }
    const d = displayValue(propOf(obj, key));
    if (d.missing) return { val: "—", unit: "", method: "" };
    return { val: d.text, unit: d.unit || "", method: d.method || "" };
  }

  function preparePrint(g, q) {
    const m = metaOf(g.grade);
    const cat = catOf(g.grade);
    const sheet = document.getElementById("print-sheet");
    if (!sheet) return;
    q = q || readQuoteForm(g);
    const today = formatDateCN(new Date());
    const docParts = [];
    if (q.includeInfo) docParts.push("牌号资料");
    if (q.includeIndustry) docParts.push("行业用途");
    if (q.includeCmp) docParts.push("竞品对比");
    if (q.includeQuote) docParts.push("报价单");
    const docName = docParts.join(" · ") || "牌号资料";

    let html = "";
    html += '<header class="ps-head">';
    html += '<div class="ps-brand"><span class="ps-mark">文</span>文博塑料</div>';
    html += '<div class="ps-head-meta"><div class="ps-doc">' + esc(docName) + "</div>";
    html += "<div>日期：" + esc(today) + "</div></div></header>";
    html += '<p class="ps-disc-top">以下物性均为公开资料典型值，仅供参考，不构成规格保证。</p>';

    html += '<div class="ps-grade">';
    html += "<h1>" + esc(g.grade) + "</h1>";
    html += '<p class="ps-maker">' + esc(m.makerShort || g.manufacturer || "") + "</p>";
    if (g.manufacturer && m.makerShort && g.manufacturer !== m.makerShort) {
      html += '<p class="ps-legal">' + esc(g.manufacturer) + "</p>";
    }
    html += '<p class="ps-type">' + esc([g.brand, g.polymer_type, cat.label].filter(Boolean).join(" · ")) + "</p>";
    if (m.line) html += '<p class="ps-line">定位：' + esc(m.line) + "</p>";
    if (m.tags && m.tags.length) html += '<p class="ps-tags">' + esc(m.tags.join(" · ")) + "</p>";
    html += "</div>";

    if (q.includeInfo) {
      html += '<section class="ps-sec"><div class="ps-split">';
      html += "<div><h3>典型用途</h3><ul class=\"ps-ul\">";
      (g.typical_applications || []).forEach(function (item) {
        const line = customerText(item);
        if (line) html += "<li>" + esc(line) + "</li>";
      });
      if (!(g.typical_applications || []).some(function (item) { return customerText(item); })) html += "<li>—</li>";
      html += "</ul></div><div><h3>卖点</h3><ul class=\"ps-ul\">";
      (g.features || []).forEach(function (item) {
        const line = customerText(item);
        if (line) html += "<li>" + esc(line) + "</li>";
      });
      if (!(g.features || []).some(function (item) { return customerText(item); })) html += "<li>—</li>";
      html += "</ul></div></div></section>";

      html += '<section class="ps-sec"><h2>关键物性</h2>';
      html += '<table class="ps-table"><thead><tr><th>项目</th><th>典型值</th><th>单位</th><th>测试条件 / 标准</th></tr></thead><tbody>';
      propKeysFor(g).forEach(function (k) {
        const c = printPropCells(g, k);
        html += "<tr><td>" + esc(PROP_LABEL[k] || k) + '</td><td class="num">' + esc(c.val) + '</td><td class="num">' + esc(c.unit || "—") + "</td><td>" + esc(c.method || "—") + "</td></tr>";
      });
      html += "</tbody></table>";
      html += "</section>";
    }

    if (q.includeIndustry) {
      const list = industriesOf(g);
      const pick = q.industrySel;
      const chosen = (!pick || pick === "all") ? list : list.filter(function (x) { return x.id === pick; });
      if (!chosen.length) {
        html += '<section class="ps-sec"><h2>行业用途</h2><p class="ps-pitch">未选择需要导出的行业。</p></section>';
      } else {
        chosen.forEach(function (ind) { html += printIndustryHtml(ind); });
      }
    }

    if (q.includeCmp) {
      const selectedNames = Array.isArray(q.comps) ? q.comps : (g.competitors || []).map(function (c) { return c.grade; });
      const selected = (g.competitors || []).filter(function (c) { return selectedNames.indexOf(c.grade) !== -1; });
      html += '<section class="ps-sec"><h2>竞品对比</h2>';
      if (m.familyNote) html += '<div class="ps-warn">' + esc(customerText(m.familyNote)) + "</div>";
      if (!selected.length) {
        html += '<p class="ps-notes">未选择需要对比的竞品。</p>';
      } else {
        const keys = (function () {
          const fake = { properties: g.properties, competitors: selected };
          return unionPropKeys(fake);
        })();
        html += '<table class="ps-table"><thead><tr><th>物性</th><th>我方 · ' + esc(g.grade) + "</th>";
        selected.forEach(function (c) {
          const tag = matchOf(g.grade, c.grade);
          html += "<th>" + esc(shortName(c.grade));
          if (c.manufacturer) html += '<div class="ps-maker-line">' + esc(shortMaker(c.manufacturer)) + "</div>";
          if (tag) html += '<span class="ps-badge ' + badgeClassPrint(tag) + '">' + esc(tag) + "</span>";
          html += "</th>";
        });
        html += "</tr></thead><tbody>";
        keys.forEach(function (k) {
          html += "<tr><td>" + esc(PROP_LABEL[k] || k) + '</td><td class="num ps-ours">';
          const ours = printPropCells(g, k);
          html += esc(ours.val) + (ours.unit ? " " + esc(ours.unit) : "") + "</td>";
          selected.forEach(function (c) {
            const d = printPropCells(c, k);
            html += '<td class="num">' + esc(d.val) + (d.unit ? " " + esc(d.unit) : "") + "</td>";
          });
          html += "</tr>";
        });
        html += "</tbody></table>";
        html += '<div class="ps-notes">';
        selected.forEach(function (c) {
          const tag = matchOf(g.grade, c.grade);
          const note = customerText(c.match_note || c.note || "");
          html += "<p><strong>" + esc(shortName(c.grade)) + "</strong>";
          if (tag) html += ' <span class="ps-badge ' + badgeClassPrint(tag) + '">' + esc(tag) + "</span>";
          html += "　" + esc(note || "—") + "</p>";
        });
        html += "</div>";
      }
      html += "</section>";
    }

    if (q.includeQuote) {
      const priceN = parseFloat(q.price);
      const qtyN = parseFloat(q.qty);
      const hasTotal = isFinite(priceN) && isFinite(qtyN) && (priceN || qtyN);
      const total = hasTotal ? priceN * qtyN : null;
      html += '<section class="ps-sec ps-quote"><h2>报价</h2>';
      html += '<table class="ps-kv">';
      html += "<tr><th>客户名称</th><td>" + esc(q.customer || "—") + "</td></tr>";
      html += "<tr><th>牌号</th><td>" + esc(g.grade) + (m.makerShort ? " · " + esc(m.makerShort) : "") + "</td></tr>";
      html += "<tr><th>单价</th><td>" + (isFinite(priceN) && q.price !== "" ? esc(formatYuan(priceN) + " 元/吨") : "—") + "</td></tr>";
      html += "<tr><th>数量</th><td>" + (isFinite(qtyN) && q.qty !== "" ? esc(String(q.qty) + " 吨") : "—") + "</td></tr>";
      html += '<tr><th>合计</th><td class="total">' + esc(total != null ? formatMoney(total) : "—") + "</td></tr>";
      html += "<tr><th>交货条款</th><td>" + esc(q.delivery || "—") + "</td></tr>";
      html += "<tr><th>报价有效期</th><td>" + esc(q.validity ? formatDateCN(q.validity) : "—") + "</td></tr>";
      html += "<tr><th>备注</th><td>" + esc(q.remarks || "—") + "</td></tr>";
      html += "</table></section>";
    }

    html += '<footer class="ps-foot">';
    html += "物性数值来自公开技术资料与厂家物性表，均为典型值或参考值，仅供对照，不构成规格保证。未列出的项目以 — 表示。具体以厂家正式物性表和合同约定为准。测试方法与样条条件不同时，牌号之间不可直接当作规格对比。";
    html += '<div class="ps-sign">文博塑料 · ' + esc(today) + "</div>";
    html += "</footer>";

    sheet.innerHTML = html;
    document.title = suggestPdfTitle(g, q);
  }

  function exportPdf(g) {
    const q = readQuoteForm(g);
    if (!q.includeInfo && !q.includeCmp && !q.includeQuote && !q.includeIndustry) {
      toast("请至少勾选一项：资料、对比、报价或行业用途");
      return;
    }
    if (q.includeCmp && (g.competitors || []).length && !(q.comps && q.comps.length)) {
      toast("已勾选对比，请至少选择一个竞品");
      return;
    }
    const prevTitle = document.title;
    document.title = suggestPdfTitle(g, q);
    preparePrint(g, q);
    const cleanup = function () {
      document.title = prevTitle;
      window.removeEventListener("afterprint", cleanup);
    };
    window.addEventListener("afterprint", cleanup);
    window.print();
  }
  window.__wbPreparePrint = function () {
    const route = parseRoute();
    const g = byId[route.id];
    if (!g) return false;
    preparePrint(g, readQuoteForm(g));
    return true;
  };

  function numericForChart(obj, key) {
    const p = propOf(obj, key);
    if (key === "density") return densityNorm(p).n;
    return numericOf(p);
  }

  function unitForChart(obj, key) {
    if (key === "density") return "g/cm³";
    const p = propOf(obj, key);
    if (p && typeof p === "object") return prettyUnit(p.unit || "");
    return "";
  }

  function renderBars(g, key) {
    const rows = [{ name: g.grade, ours: true, n: numericForChart(g, key), unit: unitForChart(g, key) }];
    (g.competitors || []).forEach(function (c) {
      const n = numericForChart(c, key);
      if (n == null) return;
      rows.push({ name: shortName(c.grade), ours: false, n: n, unit: unitForChart(c, key) });
    });
    const usable = rows.filter(function (r) { return r.n != null; });
    if (!usable.length) return '<p class="bar-empty">该项暂无可比数值。</p>';
    const nums = usable.map(function (r) { return r.n; });
    let min = Math.min.apply(null, nums);
    let max = Math.max.apply(null, nums);
    let lo, hi;
    if (key === "density") {
      const pad = Math.max(0.008, (max - min) * 0.4);
      lo = min - pad;
      hi = max + pad;
    } else {
      lo = 0;
      hi = max * 1.15 || 1;
    }
    const unit = usable[0].unit || "";
    return usable.map(function (r) {
      const pct = Math.max(4, Math.min(100, ((r.n - lo) / (hi - lo)) * 100));
      const val = (key === "density" ? r.n.toFixed(3) : String(r.n)) + (unit ? " " + unit : "");
      return '<div class="bar-row">' +
        '<div class="bar-name' + (r.ours ? " ours" : "") + '">' + esc(r.name) + "</div>" +
        '<div class="bar-track"><div class="bar-fill' + (r.ours ? " ours" : "") + '" style="width:' + pct.toFixed(1) + '%"></div></div>' +
        '<div class="bar-val">' + esc(val) + "</div></div>";
    }).join("");
  }

  function lineProp(label, obj, key) {
    const p = propOf(obj, key);
    if (key === "density") {
      const d = densityNorm(p);
      if (d.n == null && !isPresent(p)) return "—";
      const raw = displayValue(p);
      return d.label + " " + d.unit + (raw.method ? "（" + raw.method + "）" : "");
    }
    const d = displayValue(p);
    if (d.missing) return "—";
    return d.text + (d.unit ? " " + d.unit : "") + (d.method ? "（" + d.method + "）" : "");
  }

  function buildCopyText(g, vsName) {
    const m = metaOf(g.grade);
    const lines = [];
    lines.push("【" + g.grade + "】" + (g.manufacturer || "") + (g.brand ? " " + g.brand : "") + (g.polymer_type ? "　" + g.polymer_type : ""));
    lines.push("");
    if (m.line) {
      lines.push("定位：" + m.line + "。");
      lines.push("");
    }
    lines.push("关键物性（典型值，仅供参考）：");
    propKeysFor(g).forEach(function (k) {
      lines.push("· " + (PROP_LABEL[k] || k) + "：" + lineProp("", g, k).replace(/^：?/, ""));
    });
    // fix: lineProp first arg unused; value already includes method
    lines[lines.length - propKeysFor(g).length - 0]; // no-op keep lint quiet? we'll rewrite below
    return finalizeCopy(g, m, vsName);
  }

  function finalizeCopy(g, m, vsName) {
    const lines = [];
    lines.push("【" + g.grade + "】" + [g.manufacturer, g.brand, g.polymer_type].filter(Boolean).join(" · "));
    lines.push("");
    if (m.line) lines.push("定位：" + m.line + "。");
    lines.push("");
    lines.push("关键物性（典型值，仅供参考）：");
    propKeysFor(g).forEach(function (k) {
      lines.push("· " + (PROP_LABEL[k] || k) + "：" + formatLine(g, k));
    });
    if (g.typical_applications && g.typical_applications.length) {
      lines.push("");
      lines.push("典型用途：");
      g.typical_applications.forEach(function (t) { lines.push("· " + t); });
    }
    if (g.features && g.features.length) {
      lines.push("");
      lines.push("卖点：");
      g.features.forEach(function (t) { lines.push("· " + t); });
    }
    lines.push("");
    lines.push("资料来源：" + primarySource(g));
    if (vsName) {
      const c = (g.competitors || []).find(function (x) { return x.grade === vsName; });
      if (c) {
        const tag = matchOf(g.grade, c.grade);
        lines.push("");
        lines.push("——");
        lines.push("与 " + shortName(c.grade) + (c.manufacturer ? " · " + c.manufacturer : "") + " 对比（公开资料典型值，仅供参考）：");
        const keys = unionPropKeys(g).filter(function (k) {
          return isPresent(propOf(g, k)) || isPresent(propOf(c, k));
        }).slice(0, 10);
        keys.forEach(function (k) {
          lines.push("· " + (PROP_LABEL[k] || k) + "：我方 " + formatLine(g, k, true) + "  vs  对方 " + formatLine(c, k, true));
        });
        if (tag) lines.push("对标判断：" + tag + "。");
        const note = c.match_note || c.note || c.comparison_note;
        if (note) lines.push("说明：" + note);
      }
    }
    lines.push("");
    lines.push("以上数值来自公开技术资料，仅供参考，不构成规格保证。具体以厂家正式物性表和合同约定为准。");
    return lines.join("\n");
  }

  function formatLine(obj, k, compact) {
    const p = propOf(obj, k);
    if (k === "density") {
      const d = densityNorm(p);
      if (d.n == null && !isPresent(p)) return "—";
      const raw = displayValue(p);
      return d.label + " " + d.unit + (!compact && raw.method ? "（" + raw.method + "）" : "");
    }
    const d = displayValue(p);
    if (d.missing) return "—";
    return d.text + (d.unit ? " " + d.unit : "") + (!compact && d.method ? "（" + d.method + "）" : "");
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        document.body.removeChild(ta);
        resolve();
      } catch (e) {
        document.body.removeChild(ta);
        reject(e);
      }
    });
  }

  function render() {
    const route = parseRoute();
    renderFilters();
    if (route.view === "grade") {
      const g = byId[route.id];
      if (!g) {
        $main.innerHTML = '<div class="view"><p>未找到该牌号。</p><button type="button" class="back" id="btn-back">返回全部牌号</button></div>';
        return;
      }
      if (route.vs) state.vs = route.vs;
      state.jumpedFrom = route.from || "";
      renderDetail(g);
    } else {
      state.jumpedFrom = "";
      renderHome();
    }
  }

  /* events */
  $navSearch.addEventListener("focus", function () {
    state.searchOpen = true;
    renderSearchPop();
  });
  $navSearch.addEventListener("input", function () {
    state.query = $navSearch.value;
    state.searchOpen = true;
    state.activeHit = 0;
    renderSearchPop();
  });
  $navSearch.addEventListener("keydown", function (e) {
    if (!state.searchOpen) return;
    if (e.key === "ArrowDown") {
      e.preventDefault();
      state.activeHit = Math.min(state.activeHit + 1, Math.max(0, state.searchHits.length - 1));
      renderSearchPop();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      state.activeHit = Math.max(state.activeHit - 1, 0);
      renderSearchPop();
    } else if (e.key === "Enter") {
      e.preventDefault();
      const hit = state.searchHits[state.activeHit];
      if (hit) pickHit(hit);
    } else if (e.key === "Escape") {
      state.searchOpen = false;
      renderSearchPop();
      $navSearch.blur();
    }
  });
  $searchPop.addEventListener("mousedown", function (e) {
    const btn = e.target.closest(".search-item");
    if (!btn) return;
    e.preventDefault();
    const it = state.searchHits[Number(btn.getAttribute("data-i"))];
    if (it) pickHit(it);
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".search-wrap")) {
      state.searchOpen = false;
      renderSearchPop();
    }
  });

  $filters.addEventListener("click", function (e) {
    const btn = e.target.closest("[data-cat]");
    if (!btn) return;
    state.category = btn.getAttribute("data-cat");
    if (parseRoute().view !== "home") {
      location.hash = "#/";
      return;
    }
    render();
  });

  $main.addEventListener("click", function (e) {
    const card = e.target.closest(".card[data-grade]");
    if (card) {
      goGrade(card.getAttribute("data-grade"));
      return;
    }
    if (e.target.closest("#btn-back")) {
      goHome();
      return;
    }
    const seg = e.target.closest("#chart-seg button");
    if (seg) {
      state.chartKey = seg.getAttribute("data-chart");
      const route = parseRoute();
      const g = byId[route.id];
      if (!g) return;
      document.querySelectorAll("#chart-seg button").forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-chart") === state.chartKey);
      });
      document.getElementById("chart-body").innerHTML = renderBars(g, state.chartKey);
      return;
    }
    const indBtn = e.target.closest("[data-industry]");
    if (indBtn) {
      const route = parseRoute();
      const g = byId[route.id];
      if (!g) return;
      state.industryId = indBtn.getAttribute("data-industry");
      document.querySelectorAll("[data-industry]").forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-industry") === state.industryId);
      });
      const body = document.getElementById("industry-body");
      if (body) body.innerHTML = industryBodyHtml(industryById(g, state.industryId));
      const sel = document.getElementById("ex-industry-sel");
      if (sel) {
        sel.value = state.industryId;
        readQuoteForm(g);
      }
      return;
    }
    if (e.target.closest("#btn-export")) {
      const route = parseRoute();
      const g = byId[route.id];
      if (g) exportPdf(g);
      return;
    }
    if (e.target.closest("#ex-comps-all")) {
      e.preventDefault();
      document.querySelectorAll("#comp-picks input[data-comp]").forEach(function (el) { el.checked = true; });
      const route = parseRoute();
      const g = byId[route.id];
      if (g) readQuoteForm(g);
      return;
    }
  });

  $main.addEventListener("change", function (e) {
    const t = e.target;
    if (!t) return;
    if (t.id === "ex-info" || t.id === "ex-cmp" || t.id === "ex-quote" || t.id === "ex-industry" || t.id === "ex-industry-sel" || t.getAttribute("data-comp")) {
      const route = parseRoute();
      const g = byId[route.id];
      if (g) readQuoteForm(g);
      if (t.id === "ex-cmp") {
        const box = document.getElementById("comp-picks");
        if (box) box.classList.toggle("is-off", !t.checked);
      }
      if (t.id === "ex-industry") {
        const box = document.getElementById("industry-export");
        if (box) box.classList.toggle("is-off", !t.checked);
      }
    }
    if (t.id === "q-validity") {
      const route = parseRoute();
      const g = byId[route.id];
      if (g) readQuoteForm(g);
    }
  });

  $main.addEventListener("input", function (e) {
    const id = e.target && e.target.id;
    const fields = { "q-customer": 1, "q-price": 1, "q-qty": 1, "q-delivery": 1, "q-validity": 1, "q-remarks": 1 };
    if (!fields[id]) return;
    const route = parseRoute();
    if (!route.id) return;
    const g = byId[route.id];
    if (!g) return;
    const cur = readQuoteForm(g);
    const total = (parseFloat(cur.price) || 0) * (parseFloat(cur.qty) || 0);
    const box = document.getElementById("q-total");
    if (box) box.textContent = total ? formatMoney(total) : "—";
  });

  window.addEventListener("hashchange", render);

  const svg = '<svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
  document.querySelector(".search-wrap").insertAdjacentHTML("afterbegin", svg);

  render();
})();

  
  </script>
</body>
</html>
